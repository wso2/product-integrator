# Ballerina Central packages pre-bundled into the Ballerina distribution that ships inside a
# product installer, keyed by product flavor (the PRODUCT_FLAVOR values update-product.sh accepts).
#
# Why bundle at all: the distribution only carries the packages the Ballerina release itself
# bundles. Anything else is pulled from Ballerina Central on first build, so a fresh install with
# no network — or behind a proxy that cannot reach central — cannot compile the very project the
# product's own templates generate. Pre-bundling puts those packages in the distribution's package
# repository (<ballerina-home>/repo/bala, which in an install is
# <product>/components/ballerina/repo/bala), which the compiler resolves before it ever reaches out.
#
# How they reach a user. The installers put the staged packages in two places: the bundled
# distribution's <ballerina-home>/repo/bala, and the editor payload (<appRoot>/ballerina-packages).
# The second is not redundant — the bundled distribution is frequently not the one in use. A
# ballerina-runtime component update installs the STOCK upstream distribution into the data folder
# and it takes precedence; a runtime already seeded there at the same version is never re-seeded;
# and the editor-only update payload carries no runtime at all. So wi-extension applies the
# editor-payload copy to whichever Ballerina home is active on startup, which is what makes these
# packages reach existing installs rather than only brand-new ones.
#
# Each entry is <org>/<name>, comma separated. ci/build/bundle-ballerina-packages.sh resolves the
# full transitive closure of these, so listing a package's own dependencies here is unnecessary, and
# anything the distribution already ships at a compatible version is skipped — a build stages only
# the delta.
#
# Versions are not pinned here: they are whatever Central resolves as newest-compatible against the
# bundled distribution at build time, and the build logs (and uploads) the exact list it staged.
# Pinning is deliberately absent rather than forgotten — Ballerina honors a pin only through a
# complete Dependencies.toml and silently discards a partial one, so a `:version` syntax here would
# read as a pin while doing nothing.
#
# Standard-library side effects. The closure can include stdlib modules at versions NEWER than the
# distribution bundles. Those sit alongside the bundled ones in repo/bala and the newer one wins, so
# EVERY offline project in this product resolves the staged version — not just the agent ones. It is
# the same version a connected build would have picked, so it is not a regression, but it is a real
# difference from the integrator flavor.
#
# Rather than trusting a note here to stay true, every build classifies what it stages as either
# "new" (absent from the distribution) or "upgrade" (supersedes a module it ships, naming the version
# being superseded). That appears in the build log and in the header of bundled-packages.txt, so a
# distribution bump that widens the set is visible in the run that causes it. Check that line when
# ballerina.version moves.
#
# For orientation, the set measured against 2201.14.0-alpha was two packages:
#     new:     ballerina/ai.eval:0.9.0
#     upgrade: ballerina/data.jsondata:1.1.4 (distribution ships 1.1.3)
# ballerina/ai is not staged at all — that distribution already ships it at 1.15.0, which is current.
# The one upgrade is a REPAIR: the distribution bundles http 2.18.0, compiled against data.jsondata
# 1.1.4, but ships 1.1.3. Without the overlay even a plain `import ballerina/ai` fails to build
# offline on a stock 2201.14.0-alpha, with "cannot resolve module ballerina/data.jsondata:1.1.4".
# Resolving the closure catches that; a hand-written "just fetch ai.eval" list would not have.

integrator.packages=
agent-builder.packages=ballerina/ai,ballerina/ai.eval
