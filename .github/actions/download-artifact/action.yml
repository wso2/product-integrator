name: Download artifact (retried)
description: >-
  actions/download-artifact, tried up to three times. A download from the artifact store can stop
  part-way on a hosted runner; download-artifact v4 still reported success then, so the cut-off zip
  only failed a later unzip, and the whole job had to be rerun. v8 fails on a digest mismatch, and
  this action downloads again instead of failing the job on the first one. Takes the inputs of
  actions/download-artifact that the workflows use. Needs the repository checked out.

inputs:
  name:
    description: Name of the artifact to download. Empty downloads all artifacts (or those matching `pattern`).
    required: false
    default: ''
  path:
    description: Destination path. Empty means the workspace.
    required: false
    default: ''
  pattern:
    description: Glob of artifact names to download. Ignored when `name` is set.
    required: false
    default: ''
  merge-multiple:
    description: Put the files of several artifacts into one directory.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download (attempt 1)
      id: attempt1
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}

    - name: Wait before attempt 2
      if: steps.attempt1.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name || inputs.pattern || 'all artifacts' }}
      run: |
        echo "::warning::Downloading ${ARTIFACT} failed; retrying in 30s (attempt 2 of 3)."
        sleep 30

    - name: Download (attempt 2)
      id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}

    - name: Wait before attempt 3
      if: steps.attempt2.outcome == 'failure'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.name || inputs.pattern || 'all artifacts' }}
      run: |
        echo "::warning::Downloading ${ARTIFACT} failed again; retrying in 60s (attempt 3 of 3)."
        sleep 60

    # The last attempt has no continue-on-error, so its failure fails the step that uses this action.
    - name: Download (attempt 3)
      if: steps.attempt2.outcome == 'failure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        pattern: ${{ inputs.pattern }}
        merge-multiple: ${{ inputs.merge-multiple }}
