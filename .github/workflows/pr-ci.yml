name: PR CI (Integrator Build)

on:
  pull_request:
    # The branch types a PR can target, per docs/branching-strategy.md.
    branches:
      - main
      - 'feat/**'
      - '[0-9]+.[0-9]+.x'
      - 'hotfix/**'
      - 'staging/**'
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  compile-integrator:
    name: Compile Integrator (No Installers)
    uses: ./.github/workflows/compile.yml
    with:
      runner: ubuntu-latest
      build_packed_installers: false
      ballerina_extension_source: github
      mi_extension_source: github
