name: Smoke Test

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Linux DEB artifact name'
        required: false
        type: string
        default: ''
      windows_artifact_name:
        description: 'Windows MSI artifact name'
        required: false
        type: string
        default: ''
      # This workflow now runs a script out of the repository, so it has to check out the commit that
      # produced the artifact under test rather than whatever the caller happened to be triggered on.
      # Empty means "whatever actions/checkout defaults to", which is the previous behaviour.
      ref:
        description: 'Commit to take the smoke-test support scripts from'
        required: false
        type: string
        default: ''
      allow_failure:
        description: 'Report a failing smoke test without failing this workflow'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      integrator_version:
        description: 'Download from GitHub Release (e.g. 5.0.0-alpha14)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: inputs.artifact_name != '' || inputs.integrator_version != ''
    name: ${{ matrix.example }} (Linux)
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow_failure == true }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example: [hello-world-service, icp]
    env:
      DISPLAY: ':99'
    steps:
      - name: Checkout smoke-test support
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb unzip \
            libgtk-3-0 libgbm1 libnss3 libxss1 libasound2t64 \
            libx11-xcb1 libdrm2 libxcomposite1 libxdamage1 \
            libxrandr2 libatk-bridge2.0-0 libatspi2.0-0 libcups2

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

      - name: Download build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact/

      - name: Download from GitHub Release
        if: inputs.integrator_version != '' && inputs.artifact_name == ''
        run: |
          VERSION="${{ inputs.integrator_version }}"
          curl -fsSL "https://api.github.com/repos/wso2/product-integrator/releases/tags/v${VERSION}" -o release.json
          DEB=$(python3 <<'PYEOF'
          import json, re
          with open('release.json') as f:
              release = json.load(f)
          for asset in release['assets']:
              if re.fullmatch(r'wso2-integrator_.*_amd64\.deb', asset['name']):
                  print(asset['name'])
                  print(asset['browser_download_url'])
                  break
          else:
              raise SystemExit('DEB asset not found')
          PYEOF
          )
          DEB_NAME=$(echo "$DEB" | sed -n '1p')
          DEB_URL=$(echo "$DEB" | sed -n '2p')
          mkdir -p artifact
          curl -fSL -o "artifact/${DEB_NAME}" "$DEB_URL"

      - name: Install DEB and locate binary
        run: |
          sudo apt-get install -y ./artifact/*.deb
          for ROOT in /usr/share/wso2-integrator /opt/wso2-integrator; do
            BINARY="$ROOT/wso2-integrator"
            if [ -x "$BINARY" ] && [ -d "$ROOT/components" ]; then
              echo "WSO2_INTEGRATOR_PATH=$(realpath "$BINARY")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "wso2-integrator payload binary not found under /usr/share/wso2-integrator or /opt/wso2-integrator" >&2
          exit 1

      - name: Validate embedded creation form dependencies
        run: |
          PRODUCT_ROOT=$(dirname "$WSO2_INTEGRATOR_PATH")
          remote="${PRODUCT_ROOT}/resources/app/extensions/wso2.ballerina/resources/jslibs/federation/remoteEntry.js"
          if [ ! -f "${remote}" ]; then
            echo "Error: wso2.ballerina does not provide the embedded creation form (${remote})." >&2
            echo "       Reject this extension version before running the UI smoke test." >&2
            exit 1
          fi
          echo "Found Ballerina creation form: ${remote}"

      - name: Patch ICP script for dash compatibility
        if: matrix.example == 'icp'
        run: |
          ICP_SH=$(dirname "$WSO2_INTEGRATOR_PATH")/components/icp/bin/icp.sh
          if [ -f "$ICP_SH" ]; then
            sudo python3 - "$ICP_SH" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path) as f: s = f.read()
          s = s.replace('JAVA_OPTS=()', 'JAVA_OPTS=""')
          s = re.sub(r'JAVA_OPTS\+=\(\s*\n((?:\s+.*\n)*?\s*)\)',
              lambda m: 'JAVA_OPTS="$JAVA_OPTS ' + ' '.join(m.group(1).split()) + '"', s)
          s = s.replace('"${JAVA_OPTS[@]}"', '$JAVA_OPTS')
          with open(path, 'w') as f: f.write(s)
          print('Patched', path)
          PYEOF
          fi

      - name: Pre-pull ICP Ballerina modules
        if: matrix.example == 'icp'
        run: |
          BAL=$(dirname "$WSO2_INTEGRATOR_PATH")/components/ballerina/bin/bal
          export JAVA_HOME=$(find $(dirname "$WSO2_INTEGRATOR_PATH")/components/dependencies -maxdepth 1 -name 'jdk-*' -type d | head -1)
          "$BAL" pull ballerinax/metrics.logs
          "$BAL" pull wso2/icp.runtime.bridge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wso2ipw
        shell: bash
        run: |
          npm install -g wso2ipw@0.1.8
          node ci/build/patch-wso2ipw-smoke-tests.js "$(npm root -g)/wso2ipw/examples" "${{ matrix.example }}"

      - name: Install playwright-cli and Chrome
        if: matrix.example == 'icp'
        run: |
          npm install -g @playwright/cli
          cd $(npm root -g)/@playwright/cli/node_modules/playwright-core && npx playwright install --with-deps chrome

      - name: Create playwright-cli config
        if: matrix.example == 'icp'
        run: |
          mkdir -p .playwright
          echo '{"browser":{"contextOptions":{"ignoreHTTPSErrors":true}}}' > .playwright/cli.config.json

      - name: Run ${{ matrix.example }}
        env:
          WSO2IPW_ELECTRON_ARGS: ${{ matrix.example == 'icp' && '--no-sandbox --password-store=basic' || '--no-sandbox' }}
        run: bash "$(npm root -g)/wso2ipw/examples/${{ matrix.example }}/run-all.sh"

      - name: Report non-blocking failure
        if: ${{ failure() && inputs.allow_failure == true }}
        shell: bash
        run: |
          echo "::warning title=Smoke test failed (non-blocking)::${{ matrix.example }} (Linux) failed. The build was published anyway; see this job's log and the uploaded screenshots."
          {
            echo "### :warning: Smoke test failed (non-blocking)"
            echo ""
            echo '`${{ matrix.example }}` (Linux) failed and did not block the build.'
            echo "Logs, editor logs and screenshots are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect editor logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p editor-logs
          # code-oss writes per-session logs (main.log, exthost.log, per-extension output) under
          # <user-data-dir>/logs. The user-data-dir is not a guess: main.ts passes
          # product.nameShort to getUserDataPath(), and getDefaultUserDataPath() joins it onto
          # $XDG_CONFIG_HOME (or ~/.config) on Linux. nameShort is set in ci/build/update-product.sh.
          # Copying only that tree keeps unrelated logs out of the artifact.
          USER_DATA="${XDG_CONFIG_HOME:-$HOME/.config}/WSO2 Integrator"
          if [ -d "${USER_DATA}/logs" ]; then
            cp -R "${USER_DATA}/logs" editor-logs/
          else
            echo "No log directory at ${USER_DATA}/logs"
          fi
          echo "Collected log files:"; find editor-logs -type f 2>/dev/null || true

      - name: Upload editor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-editor-logs-${{ matrix.example }}-linux
          path: editor-logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.example }}-linux
          path: |
            /home/runner/.wso2ipw/*/daemon.log
            /home/runner/.wso2ipw/*/daemon.err
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots-${{ matrix.example }}-linux
          path: "*.png"
          if-no-files-found: ignore

  windows:
    if: inputs.windows_artifact_name != '' || inputs.integrator_version != ''
    name: ${{ matrix.example }} (Windows)
    runs-on: windows-2022
    continue-on-error: ${{ inputs.allow_failure == true }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example: [hello-world-service, icp]
    steps:
      - name: Checkout smoke-test support
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download build artifact
        if: inputs.windows_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows_artifact_name }}
          path: artifact/

      - name: Download from GitHub Release
        if: inputs.integrator_version != '' && inputs.windows_artifact_name == ''
        shell: pwsh
        run: |
          $version = "${{ inputs.integrator_version }}"
          $release = Invoke-RestMethod "https://api.github.com/repos/wso2/product-integrator/releases/tags/v$version"
          $asset = $release.assets | Where-Object { $_.name -match '^wso2-integrator-.*\.msi$' } | Select-Object -First 1
          if (-not $asset) { throw 'MSI asset not found' }
          New-Item -ItemType Directory -Path artifact -Force
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "artifact/$($asset.name)"

      - name: Install MSI
        shell: pwsh
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 1 /f
          $msi = Get-ChildItem artifact -Filter '*.msi' | Select-Object -First 1
          $installDir = 'C:\w\'
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart INTEGRATORFOLDER=`"$installDir`"" -Wait -PassThru
          Write-Host "msiexec exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -Filter 'WSO2 Integrator.exe' -Depth 2 |
            Select-Object -First 1
          if (-not $binary) { throw 'WSO2 Integrator.exe not found' }
          "WSO2_INTEGRATOR_PATH=$($binary.FullName)" | Out-File -Append $env:GITHUB_ENV
          # Exclude from Defender to avoid I/O throttling
          Add-MpPreference -ExclusionPath $installDir
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\WSO2Integrator"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.ballerina"

      - name: Validate embedded creation form dependencies
        shell: pwsh
        run: |
          $productRoot = Split-Path $env:WSO2_INTEGRATOR_PATH
          $remote = Join-Path $productRoot 'resources\app\extensions\wso2.ballerina\resources\jslibs\federation\remoteEntry.js'
          if (-not (Test-Path $remote -PathType Leaf)) {
            throw "wso2.ballerina does not provide the embedded creation form ($remote). Reject this extension version before running the UI smoke test."
          }
          Write-Host "Found Ballerina creation form: $remote"

      - name: Pre-pull ICP Ballerina modules
        if: matrix.example == 'icp'
        shell: pwsh
        run: |
          $base = Split-Path $env:WSO2_INTEGRATOR_PATH
          $bal = Join-Path $base 'components\ballerina\bin\bal.bat'
          $env:JAVA_HOME = (Get-ChildItem (Join-Path $base 'components\dependencies') -Directory -Filter 'jdk-*' | Select-Object -First 1).FullName
          & $bal pull ballerinax/metrics.logs
          & $bal pull wso2/icp.runtime.bridge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wso2ipw
        shell: bash
        run: |
          npm install -g wso2ipw@0.1.8
          node ci/build/patch-wso2ipw-smoke-tests.js "$(npm root -g)/wso2ipw/examples" "${{ matrix.example }}"

      - name: Install playwright-cli and Chrome
        if: matrix.example == 'icp'
        shell: bash
        run: |
          npm install -g @playwright/cli
          cd $(npm root -g)/@playwright/cli/node_modules/playwright-core && npx playwright install --with-deps chrome

      - name: Create playwright-cli config
        if: matrix.example == 'icp'
        shell: bash
        run: |
          mkdir -p .playwright
          echo '{"browser":{"contextOptions":{"ignoreHTTPSErrors":true}}}' > .playwright/cli.config.json

      - name: Run ${{ matrix.example }}
        shell: bash
        run: bash "$(npm root -g)/wso2ipw/examples/${{ matrix.example }}/run-all.sh"

      - name: Report non-blocking failure
        if: ${{ failure() && inputs.allow_failure == true }}
        shell: bash
        run: |
          echo "::warning title=Smoke test failed (non-blocking)::${{ matrix.example }} (Windows) failed. The build was published anyway; see this job's log and the uploaded screenshots."
          {
            echo "### :warning: Smoke test failed (non-blocking)"
            echo ""
            echo '`${{ matrix.example }}` (Windows) failed and did not block the build.'
            echo "Logs, editor logs and screenshots are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect editor logs on failure
        if: failure()
        # pwsh, not bash: $env:APPDATA is a Windows path, and Git Bash cannot test or traverse it
        # without cygpath. The rest of this job's native steps already use pwsh.
        shell: pwsh
        run: |
          # Same path as the Linux collector, via getDefaultUserDataPath()'s win32 branch:
          # $APPDATA joined with product.nameShort ("WSO2 Integrator", set in update-product.sh).
          $logs = Join-Path $env:APPDATA 'WSO2 Integrator\logs'
          New-Item -ItemType Directory -Path editor-logs -Force | Out-Null
          if (Test-Path $logs) {
            # SilentlyContinue for the same reason the Linux collector uses `set +e`: GitHub runs
            # pwsh steps with $ErrorActionPreference='stop', and a locked log file must not turn
            # diagnostics collection into a second failure.
            Copy-Item $logs -Destination editor-logs -Recurse -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "No log directory at $logs"
          }
          Write-Host 'Collected log files:'
          Get-ChildItem editor-logs -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }

      - name: Upload editor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-editor-logs-${{ matrix.example }}-windows
          path: editor-logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots-${{ matrix.example }}-windows
          path: "*.png"
          if-no-files-found: ignore
