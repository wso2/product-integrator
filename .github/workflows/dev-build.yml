name: Development Build

# An ad-hoc build of whatever ref you dispatch it on — "build my branch and give me an installer".
#
# Versions are timestamped for this run only: a `-SNAPSHOT` branch builds as 5.1.0-<yyyymmddHHmm>
# with the extension at 1.1.<yymmddHH>. Nothing is committed to any branch and nothing is published
# to GitHub Releases; you get the workflow artifacts.
#
# daily-build.yml calls this for the nightly, passing the `workflow_call` inputs below. Real
# releases are release.yml.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select runner type'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - codebuild
      build_linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build for macOS (Apple Silicon and Intel)'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean
      build_packed_installers:
        description: 'Whether to build Ballerina, ICP, and Integrator packed installers'
        required: true
        default: true
        type: boolean
      run_smoke_tests:
        description: 'Whether to run the UI smoke tests. Only takes effect when build_packed_installers is true.'
        required: true
        default: true
        type: boolean
      smoke_tests_required:
        description: 'Whether a failing smoke test fails this build.'
        required: false
        default: true
        type: boolean
      ballerina_extension_source:
        description: 'Choose whether to bundle Ballerina from GitHub VSIX or use marketplace flow'
        required: true
        default: 'github'
        type: choice
        options:
          - marketplace
          - github
      mi_extension_source:
        description: 'Choose whether to bundle MI from GitHub VSIX or use marketplace flow'
        required: true
        default: 'github'
        type: choice
        options:
          - marketplace
          - github
  # Absent from workflow_dispatch on purpose: a dispatch must not be able to pin a foreign tree or
  # replace a release, so on that route these are empty.
  workflow_call:
    inputs:
      ref:
        description: 'Ref or SHA to build. Empty builds the ref this workflow was called from.'
        required: false
        default: ''
        type: string
      target_commitish:
        description: 'Commit the published tag should point at.'
        required: false
        default: ''
        type: string
      versions_artifact:
        description: 'Artifact holding the already-stamped versions. Empty stamps here.'
        required: false
        default: ''
        type: string
      publish_tag:
        description: 'Rolling tag and release to replace. Empty publishes nothing.'
        required: false
        default: ''
        type: string
      runner:
        required: false
        default: 'ubuntu-latest'
        type: string
      build_linux:
        required: false
        default: true
        type: boolean
      build_macos:
        required: false
        default: true
        type: boolean
      build_windows:
        required: false
        default: true
        type: boolean
      build_packed_installers:
        required: false
        default: true
        type: boolean
      run_smoke_tests:
        required: false
        default: true
        type: boolean
      smoke_tests_required:
        description: 'Fail the build when the smoke tests fail.'
        required: false
        default: true
        type: boolean
      ballerina_extension_source:
        required: false
        default: 'github'
        type: string
      mi_extension_source:
        required: false
        default: 'github'
        type: string

# `contents: write` is required even though this dispatcher itself commits nothing: GitHub
# statically checks that a caller's permissions are at least what a reusable workflow it calls
# requests, and build.yml (called below) declares `contents: write`. `read` here makes every
# dispatch fail at startup with "requesting 'contents: write', but is only allowed 'contents:
# read'" before any job is scheduled. `id-token: write` is still required for cosign.
permissions:
  id-token: write
  contents: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # Empty on the dispatch route: stamp the dispatched ref, publish nothing.
      ref: ${{ inputs.ref || '' }}
      target_commitish: ${{ inputs.target_commitish || '' }}
      versions_artifact: ${{ inputs.versions_artifact || '' }}
      publish_tag: ${{ inputs.publish_tag || '' }}
      is_prerelease: true
      runner: ${{ inputs.runner }}
      build_linux: ${{ inputs.build_linux }}
      build_macos: ${{ inputs.build_macos }}
      build_windows: ${{ inputs.build_windows }}
      build_packed_installers: ${{ inputs.build_packed_installers }}
      run_smoke_tests: ${{ inputs.run_smoke_tests }}
      smoke_tests_required: ${{ inputs.smoke_tests_required }}
      ballerina_extension_source: ${{ inputs.ballerina_extension_source }}
      mi_extension_source: ${{ inputs.mi_extension_source }}
