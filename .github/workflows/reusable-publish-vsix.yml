name: Reusable Publish WI Extension

# Shared by publish-vsix.yml (manual, ad-hoc publish from any existing tag) and release.yml's
# optional marketplace-publish step (publish the tag a release just cut). Keeping the actual
# vsce/ovsx logic here means both callers stay in sync instead of drifting apart.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish from, e.g. v5.1.0'
        required: true
        type: string
      isPreRelease:
        description: 'Publish as a pre-release'
        required: true
        type: boolean
        default: false
      vscode:
        description: 'Publish to VS Code Marketplace'
        required: true
        type: boolean
        default: true
      openVSX:
        description: 'Publish to Open VSX marketplace'
        required: true
        type: boolean
        default: true

jobs:
  publish:
    name: Publish vsix to marketplaces
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download WI extension VSIX from release
        env:
          TAG: ${{ inputs.tag }}
        run: gh release download "${TAG}" --repo "${{ github.repository }}" --pattern 'wso2-integrator-*.vsix'

      - name: Get vsix path
        id: vsix
        run: |
          file=$(ls wso2-integrator-*.vsix)
          echo "vsixName=${file}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.isPreRelease }}" == "true" ]; then
            echo "releaseMode=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "releaseMode= " >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install publishing CLIs
        run: |
          npm install -g @vscode/vsce ovsx

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.vscode }}
        run: vsce publish -p ${{ secrets.VSCE_TOKEN }} --packagePath ${{ steps.vsix.outputs.vsixName }} ${{ steps.vsix.outputs.releaseMode }}

      - name: Publish to Open VSX marketplace
        if: ${{ inputs.openVSX }}
        run: ovsx publish -p ${{ secrets.OPENVSX_TOKEN }} --packagePath ${{ steps.vsix.outputs.vsixName }} ${{ steps.vsix.outputs.releaseMode }}
