name: Build

# The build engine: compile, package the installers for every platform, sign, and optionally publish.
# Not runnable on its own — dev-build.yml and release.yml are the two entry points. They prepare a
# branch, stamp the versions, and hand the result here as an artifact.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Select runner type'
        required: false
        default: 'codebuild'
        type: string
      build_linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build for macOS (Apple Silicon and Intel)'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean
      build_packed_installers:
        description: 'Whether to build Ballerina, ICP, and Integrator packed installers'
        default: true
        required: false
        type: boolean
      run_smoke_tests:
        description: 'Whether to run the UI smoke tests. Only takes effect when build_packed_installers is true.'
        default: true
        required: false
        type: boolean
      smoke_tests_required:
        description: 'Whether a failing smoke test fails this build and blocks publishing.'
        default: true
        required: false
        type: boolean
      ballerina_extension_source:
        description: 'Choose whether to bundle Ballerina from GitHub VSIX or use marketplace flow'
        required: false
        default: 'github'
        type: string
      mi_extension_source:
        description: 'Choose whether to bundle MI from GitHub VSIX or use marketplace flow'
        required: false
        default: 'github'
        type: string
      # Under `workflow_call`, `github.ref` is the *caller's* triggering ref, so a dispatcher that
      # prepares a branch and then calls this workflow would compile the ref it was dispatched on
      # (main) rather than the branch it just prepared. Callers that prepare a branch pass its SHA
      # here so the tree, the branch, the tag and `target_commitish` all describe the same commit.
      #
      # One thing this cannot fix: with `uses: ./.github/workflows/...` the reusable workflow
      # *definitions* are always read from the caller's ref, never from this input. That is
      # harmless here, since both dispatchers cut their branch from the ref they were dispatched
      # on and add nothing but a version commit.
      ref:
        description: 'Ref or SHA to build. Empty builds the ref this workflow was called from.'
        required: false
        default: ''
        type: string
      versions_artifact:
        description: 'Artifact holding the already-stamped component-versions.properties and wi-extension package.json. Empty means stamp here from the current ref.'
        required: false
        default: ''
        type: string
      publish_tag:
        description: "Release tag to publish under. Empty publishes nothing (workflow artifacts only); `nightly` is the rolling tag and replaces the previous release; anything else is created as-is."
        required: false
        default: ''
        type: string
      is_prerelease:
        description: 'Mark the GitHub release as a pre-release. False also makes it the repository Latest.'
        required: false
        default: true
        type: boolean
      target_commitish:
        description: 'Commit the release points at. Empty uses the commit this run started from.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: write     

env:
  awsRunnerId: codebuild-wso2_product-integrator-${{ github.run_id }}-${{ github.run_attempt }}  

jobs:
  # Settle the product and extension versions ONCE, up front, and hand the resulting files to every
  # other job as an artifact. A VS Code extension version must be exactly three integers, so
  # `1.2.0-SNAPSHOT` can never be packaged and some job has to stamp on every path.
  #
  # Callers that prepared a branch (daily-build.yml, release.yml) pass their own artifact and
  # this job just re-publishes it. A caller that passes nothing gets a stamp from the current ref:
  # apply-version.sh is shape-based, rewriting only `-SNAPSHOT` values, so a concrete version always
  # passes through verbatim and the build ships exactly what the branch declares.
  stamp-version:
    name: Stamp Versions
    runs-on: ubuntu-latest
    outputs:
      integrator_version: ${{ steps.stamp.outputs.integrator_version }}
      wi_extension_version: ${{ steps.stamp.outputs.wi_extension_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download the caller's versions
        if: ${{ inputs.versions_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.versions_artifact }}
          path: .

      # Re-run unconditionally: a no-op on a prepared branch, and the stamp itself when the caller
      # passed nothing. Either way this is the single point where the versions become final.
      - name: Apply versions
        id: stamp
        shell: bash
        run: |
          chmod +x ./ci/build/apply-version.sh
          ./ci/build/apply-version.sh

      - name: Upload versions
        uses: actions/upload-artifact@v4
        with:
          name: build-versions
          path: |
            ci/build/component-versions.properties
            wi/wi-extension/package.json
          if-no-files-found: error

  resolve-versions:
    name: Resolve Component Versions
    needs: stamp-version
    runs-on: ubuntu-latest
    outputs:
      ballerina_version: ${{ steps.read-versions.outputs.ballerina_version }}
      ballerina_extension_version: ${{ steps.read-versions.outputs.ballerina_extension_version }}
      ballerina_extension_tag: ${{ steps.read-versions.outputs.ballerina_extension_tag }}
      mi_extension_version: ${{ steps.read-versions.outputs.mi_extension_version }}
      mi_extension_tag: ${{ steps.read-versions.outputs.mi_extension_tag }}
      icp_version: ${{ steps.read-versions.outputs.icp_version }}
      integrator_version: ${{ steps.read-versions.outputs.integrator_version }}
      ballerina_jre_version: ${{ steps.read-versions.outputs.ballerina_jre_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download stamped versions
        uses: actions/download-artifact@v4
        with:
          name: build-versions
          path: .

      - name: Read versions file
        id: read-versions
        shell: bash
        run: |
          VERSIONS_FILE="ci/build/component-versions.properties"
          if [ ! -f "${VERSIONS_FILE}" ]; then
            echo "Error: ${VERSIONS_FILE} does not exist." >&2
            exit 1
          fi

          read_property() {
            local key="$1"
            awk -F= -v property_key="$key" '$1 == property_key { print substr($0, index($0, "=") + 1); exit }' "${VERSIONS_FILE}" | tr -d '\r'
          }

          BALLERINA_VERSION=$(read_property "ballerina.version")
          BALLERINA_EXTENSION_VERSION=$(read_property "ballerina.extension.version")
          MI_EXTENSION_VERSION=$(read_property "wso2.micro-integrator.extension.version")
          ICP_VERSION=$(read_property "icp.version")
          INTEGRATOR_VERSION=$(read_property "integrator.version")
          BALLERINA_JRE_VERSION=$(read_property "ballerina.jre.version")

          # A `<key>.tag` companion is only present when the upstream release tag cannot be derived
          # from the version (a rolling tag such as wso2/ballerina-vscode's `nightly`, pinned by
          # ci/build/resolve-nightly-versions.sh). Otherwise the conventional v<version> tag applies.
          BALLERINA_EXTENSION_TAG=$(read_property "ballerina.extension.version.tag")
          MI_EXTENSION_TAG=$(read_property "wso2.micro-integrator.extension.version.tag")

          if [ -z "${BALLERINA_VERSION}" ] || [ -z "${ICP_VERSION}" ] || [ -z "${INTEGRATOR_VERSION}" ] || [ -z "${BALLERINA_JRE_VERSION}" ]; then
            echo "Error: ballerina.version, icp.version, integrator.version, and ballerina.jre.version must be set in ${VERSIONS_FILE}." >&2
            exit 1
          fi

          if [[ -n "${BALLERINA_EXTENSION_VERSION}" && "${BALLERINA_EXTENSION_VERSION}" =~ ^[vV] ]]; then
            echo "Error: ballerina.extension.version must not start with 'v'." >&2
            exit 1
          fi

          if [[ -n "${MI_EXTENSION_VERSION}" && "${MI_EXTENSION_VERSION}" =~ ^[vV] ]]; then
            echo "Error: wso2.micro-integrator.extension.version must not start with 'v'." >&2
            exit 1
          fi

          echo "ballerina_version=${BALLERINA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_extension_version=${BALLERINA_EXTENSION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_extension_tag=${BALLERINA_EXTENSION_TAG:-v${BALLERINA_EXTENSION_VERSION}}" >> "$GITHUB_OUTPUT"
          echo "mi_extension_version=${MI_EXTENSION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mi_extension_tag=${MI_EXTENSION_TAG:-v${MI_EXTENSION_VERSION}}" >> "$GITHUB_OUTPUT"
          echo "icp_version=${ICP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "integrator_version=${INTEGRATOR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_jre_version=${BALLERINA_JRE_VERSION}" >> "$GITHUB_OUTPUT"

  compile:
    needs: [stamp-version, resolve-versions]
    uses: ./.github/workflows/compile.yml
    secrets: inherit
    with:
      runOnAWS: ${{ inputs.runner == 'codebuild' }}
      ballerina_extension_source: ${{ inputs.ballerina_extension_source }}
      mi_extension_source: ${{ inputs.mi_extension_source }}
      build_packed_installers: ${{ inputs.build_packed_installers == true }}
      versions_artifact: build-versions
      ref: ${{ inputs.ref }}
      is_prerelease: ${{ inputs.is_prerelease }}

  smoke-test:
    if: ${{ inputs.build_packed_installers == true && inputs.run_smoke_tests == true }}
    needs: compile
    uses: ./.github/workflows/smoke-test.yml
    with:
      artifact_name: Product-Integrator-DEB
      # Same reason `compile` gets it: the smoke test runs ci/build/patch-wso2ipw-smoke-tests.js, so it
      # must read that script from the commit under test, not from the caller's triggering ref.
      ref: ${{ inputs.ref }}
      allow_failure: ${{ inputs.smoke_tests_required == false }}

  smoke-test-windows:
    if: ${{ inputs.build_windows == true && inputs.build_packed_installers == true && inputs.run_smoke_tests == true }}
    needs: build-windows
    uses: ./.github/workflows/smoke-test.yml
    with:
      windows_artifact_name: Product-Integrator-Windows
      ref: ${{ inputs.ref }}
      allow_failure: ${{ inputs.smoke_tests_required == false }}

  build-macos:
    if: ${{ inputs.build_macos == true }}
    name: Build (macOS)
    runs-on: ${{ matrix.runner }}
    needs: [resolve-versions, compile]
    defaults:
      run:
        working-directory: lib/vscode
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            # macos-15-intel is the last available Intel (x86_64) GitHub-hosted runner.
            # It will be retired in August 2027 — revisit the x64 build strategy before then.
            #http://github.com/actions/runner-images/issues/13045
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: lib/vscode/.nvmrc
          cache: npm
          cache-dependency-path: lib/vscode/package-lock.json

      - name: Cache Rust toolchain (macOS)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-toolchain-macos-${{ matrix.arch }}-${{ hashFiles('lib/vscode/cli/Cargo.lock') }}
          restore-keys: |
            cargo-toolchain-macos-${{ matrix.arch }}-
            cargo-toolchain-macos-

      - name: Cache CLI compilation (macOS)
        id: cache-cli-macos
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/cli/target/
          key: cli-macos-${{ matrix.arch }}-${{ hashFiles('patches/*.diff', 'lib/vscode/cli/Cargo.lock', 'lib/vscode/cli/src/**/*.rs', 'lib/vscode/cli/Cargo.toml') }}
          restore-keys: |
            cli-macos-${{ matrix.arch }}-

      - name: Cache native modules (macOS)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            lib/vscode/.build/node_modules_cache
          key: native-modules-macos-${{ matrix.arch }}-${{ hashFiles('lib/vscode/package-lock.json', 'patches/*.diff') }}
          restore-keys: |
            native-modules-macos-${{ matrix.arch }}-
            native-modules-macos-

      - name: Cache built-in extensions
        id: cache-extensions-macos
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/.build/builtInExtensions
            lib/vscode/.build/extensions
          key: extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-${{ hashFiles('patches/*.diff', 'ci/build/update-product.sh', 'ci/build/component-versions.properties', 'lib/vscode/package.json', 'wi/**') }}
          # Partial restore so a cold key doesn't mean a cold cache: this prefix is the exact key minus
          # the file-hash component, so a patch or wi/** edit falls back to the previous run instead of
          # re-downloading every extension.
          #
          # What the fallback does and does not hold fixed, since it is not uniform: Ballerina and MI
          # have their own key fields -- they are the two with a marketplace-vs-vsix source switch, and
          # the version came along with the switch -- so a fallback cannot cross their versions. The
          # streaming-integrator, hurl-client and mcp-server-inspector versions live only inside the
          # dropped hash, so a fallback CAN cross those, as it can WI's. That is safe but not free:
          # download-builtin-extensions re-validates by version string (isUpToDate), which catches those
          # three because their versions move when their contents do. It cannot catch WI, whose version
          # is hand-bumped and stays constant across content changes -- hence the explicit removal in
          # "Install builtin extensions" below.
          restore-keys: |
            extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-

      - name: Download compilation artifact
        uses: actions/download-artifact@v4
        with:
          name: compilation
          path: lib/vscode

      - name: Extract compilation output
        run: tar -xzf compilation.tar.gz

      - name: Download WI extension VSIX
        uses: actions/download-artifact@v4
        with:
          name: wi-extension-vsix
          path: wi/wi-extension

      - name: Install quilt (macOS)
        run: |
          brew install quilt

      - name: Apply patches (macOS)
        run: quilt push -a

      - name: Set Ballerina extension version
        if: ${{ needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          echo "BALLERINA_EXTENSION_VERSION=${{ needs.resolve-versions.outputs.ballerina_extension_version }}" >> "$GITHUB_ENV"

      - name: Download archived Ballerina VSIX
        if: ${{ inputs.ballerina_extension_source == 'github' && needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          BALLERINA_VSIX_PATH=$(./ci/download-vsix.sh "wso2/ballerina-vscode" "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" "ballerina-${{ needs.resolve-versions.outputs.ballerina_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.ballerina_extension_tag }}")
          echo "BALLERINA_VSIX_PATH=${BALLERINA_VSIX_PATH}" >> "$GITHUB_ENV"

      - name: Download archived MI VSIX
        if: ${{ inputs.mi_extension_source == 'github' && needs.resolve-versions.outputs.mi_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          MI_VSIX_PATH=$(./ci/download-vsix.sh "wso2/mi-vscode" "${{ needs.resolve-versions.outputs.mi_extension_version }}" "micro-integrator-${{ needs.resolve-versions.outputs.mi_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.mi_extension_tag }}")
          echo "MI_VSIX_PATH=${MI_VSIX_PATH}" >> "$GITHUB_ENV"

      # Deliberately after the cache steps: a timestamped version in
      # hashFiles('ci/build/component-versions.properties') would bust the extensions cache every run.
      - name: Download stamped versions
        uses: actions/download-artifact@v4
        with:
          name: build-versions
          path: .

      - name: Update product.json and branding
        working-directory: .
        run: |
          chmod +x ./ci/build/update-product.sh
          ./ci/build/update-product.sh "${{ needs.resolve-versions.outputs.integrator_version }}"

      - name: Validate Xcode tools (macOS)
        run: |
          xcode-select -p
          python3 -m pip install --user setuptools || true

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci

      - name: Mixin distro modules
        run: |
          node build/azure-pipelines/distro/mixin-npm.ts || true
          node build/azure-pipelines/distro/mixin-quality.ts || true

      - name: Install builtin extensions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.cache-extensions-macos.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Extensions cache hit - using shared cached extensions"
          else
            echo "⬇️ Downloading built-in extensions"
            # wso2.wso2-integrator is pinned in product.json to the hand-bumped version in
            # wi/wi-extension/package.json, which does not move when wi/** content changes.
            # isUpToDate() (lib/vscode/build/lib/builtInExtensions.ts) compares only that version
            # string, so a prefix-restored copy would be judged current and the vsix just built
            # would never be unpacked. Reaching this branch means the exact key missed, so drop it
            # and force a re-unpack.
            rm -rf .build/builtInExtensions/wso2.wso2-integrator
            npm run download-builtin-extensions
          fi

      - name: Build client (macOS ${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run gulp vscode-darwin-${{ matrix.arch }}-min-ci

      - name: Build CLI (macOS ${{ matrix.arch }})
        run: |
          source "$HOME/.cargo/env"
          cd cli
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TARGET_DIR="./target/aarch64-apple-darwin/release"
            TARGET_TRIPLE="aarch64-apple-darwin"
          else
            TARGET_DIR="./target/x86_64-apple-darwin/release"
            TARGET_TRIPLE="x86_64-apple-darwin"
          fi
          
          if [ "${{ steps.cache-cli-macos.outputs.cache-hit }}" = "true" ]; then
            echo "✅ CLI cache hit - checking for cached CLI binary"
            if [ -f "$TARGET_DIR/code" ]; then
              echo "Cached CLI binary found and ready to use"
            else
              echo "⚠️ Cache hit but binary missing - rebuilding"
              cargo build --release --bin=code --target=$TARGET_TRIPLE
            fi
          else
            echo "❌ CLI cache miss - compiling CLI"
            cargo build --release --bin=code --target=$TARGET_TRIPLE
          fi
          
          # Set CLI_BIN path relative to parent directory (after cd ..)
          CLI_BIN="./cli/$TARGET_DIR/code"
          cd ..

          # Verify CLI binary was built
          if [ ! -f "$CLI_BIN" ]; then
            echo "CLI binary not found at $CLI_BIN" >&2
            find ./cli/target -type f -name code 2>/dev/null || true
            exit 1
          fi
          
          # Get CLI app name from the source product.json
          CLI_APP_NAME=$(node -p "require('./product.json').tunnelApplicationName")
          
          # Find the .app directory inside VSCode-darwin-arm64
          APP_DIR=$(find "../VSCode-darwin-${{ matrix.arch }}" -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: Could not find .app directory in VSCode-darwin-${{ matrix.arch }}" >&2
            ls -la "../VSCode-darwin-${{ matrix.arch }}/"
            exit 1
          fi
          
          # Copy CLI to build output
          mkdir -p "$APP_DIR/Contents/Resources/app/bin"
          cp "$CLI_BIN" "$APP_DIR/Contents/Resources/app/bin/$CLI_APP_NAME"
          chmod +x "$APP_DIR/Contents/Resources/app/bin/$CLI_APP_NAME"

      - name: Re-package with CLI (macOS ${{ matrix.arch }})
        run: |
          # Re-create the zip with the CLI included
          mkdir -p ../artifacts
          (cd .. && zip -qry "artifacts/VSCode-darwin-${{ matrix.arch }}.zip" VSCode-darwin-${{ matrix.arch }})

      - name: Sign macOS application
        run: |
          # Find the app directory
          APP_DIR=$(find "../VSCode-darwin-${{ matrix.arch }}" -name "*.app" -type d | head -1)
          
          if [ -n "$APP_DIR" ]; then
            echo "Signing application: $APP_DIR"
            
            # Ad-hoc signing (for local development/testing)
            codesign --force --deep --sign - "$APP_DIR"
            
            # Verify the signature
            codesign --verify --verbose "$APP_DIR"
            
            echo "Application signed successfully"
          else
            echo "No .app directory found to sign"
          fi

      - name: Upload macOS artifacts
        if: ${{ inputs.build_packed_installers == false }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-darwin-${{ matrix.arch }}
          path: |
            lib/artifacts/*
          if-no-files-found: error
      
      - name: Zip the artifacts and copy artifacts
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          APP_DIR=$(find "../VSCode-darwin-${{ matrix.arch }}" -name "*.app" -type d | head -1)
          mkdir -p ../artifacts
          (cd .. && zip -qry "artifacts/VSCode-darwin-${{ matrix.arch }}.zip" VSCode-darwin-${{ matrix.arch }})
          cp ../artifacts/VSCode-darwin-${{ matrix.arch }}.zip ../../installers/mac/
      - name: Build macOS installer packages
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          ROOT_DIR=$(pwd)
          echo "Root dir: ${ROOT_DIR}"
          BALLERINA_VERSION="${{ needs.resolve-versions.outputs.ballerina_version }}"
          BALLERINA_VERSION_FILENAME="${BALLERINA_VERSION%-*}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
          BALLERINA_ARCH="macos-arm"
          JRE_PLATFORM="macos-arm-64"
          else
          BALLERINA_ARCH="macos"
          JRE_PLATFORM="macos-64"
          fi
          BALLERINA_URL="https://github.com/ballerina-platform/ballerina-distribution/releases/download/v${BALLERINA_VERSION}/ballerina-${BALLERINA_VERSION_FILENAME}-swan-lake-${BALLERINA_ARCH}.zip"
          ICP_VERSION="${{ needs.resolve-versions.outputs.icp_version }}"
          ICP_VERSION_FILENAME="${ICP_VERSION%-*}"
          if [ "$ICP_VERSION" != "$ICP_VERSION_FILENAME" ]; then
            ICP_VERSION_FILENAME="${ICP_VERSION_FILENAME}-SNAPSHOT"
          fi
          ICP_URL="https://github.com/wso2/integration-control-plane/releases/download/v${ICP_VERSION}/wso2-integration-control-plane-${ICP_VERSION}.zip"
          JRE_VERSION="${{ needs.resolve-versions.outputs.ballerina_jre_version }}"
          JRE_URL="https://github.com/ballerina-platform/ballerina-custom-jre/releases/download/${JRE_VERSION}/ballerina-jre-${JRE_PLATFORM}-${JRE_VERSION}.zip"
          INTEGRATOR_VERSION="${{ needs.resolve-versions.outputs.integrator_version }}"
          cd ./installers/mac
          wget -O ballerina.zip "$BALLERINA_URL"
          wget -O icp.zip "$ICP_URL"
          wget -O jre.zip "$JRE_URL"
          ./build.sh ballerina.zip $BALLERINA_VERSION VSCode-darwin-${{ matrix.arch }}.zip icp.zip jre.zip $INTEGRATOR_VERSION ${{ matrix.arch }}
          cd ${ROOT_DIR}

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Upload macOS artifacts to S3
        if: ${{ inputs.build_packed_installers == true }}
        working-directory: .
        run: |
          S3_PATH="s3://${{ secrets.AWS_S3_BUCKET }}/wi/${{ github.run_id }}/"
          aws s3 cp installers/mac/ "${S3_PATH}" --recursive --exclude "*" --include "*.dmg"
      
      - name: Upload macOS DMG artifacts
        if: ${{ inputs.build_packed_installers == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Product-Integrator-Darwin-DMG-${{ matrix.arch }}
          path: |
            installers/mac/*.dmg
          if-no-files-found: error

      - name: cosign-installer
        if: ${{ inputs.build_packed_installers == true }}
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign the dmg installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          cosign sign-blob installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg --output-certificate installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg.pem --output-signature installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg.sig --yes

      - name: Verify signature of the dmg installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          cosign verify-blob installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg --certificate installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg.pem --signature installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg.sig --certificate-identity=https://github.com/wso2/product-integrator/.github/workflows/build.yml@${{ github.ref }} --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: Generate Hashes for dmg installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          openssl dgst -sha256 -out installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg.sha256 installers/mac/wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}-${{ matrix.arch }}.dmg

      - name: Upload Signatures and Hashes for mac installers
        if: ${{ inputs.build_packed_installers == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Signatures-and-Hashes-MAC-${{ matrix.arch }}
          path: |
            installers/mac/*.pem
            installers/mac/*.sig
            installers/mac/*.sha256
          if-no-files-found: error

  build-windows:
    if: ${{ inputs.build_windows == true }}
    name: Build (Windows)
    runs-on: windows-2022
    needs: [resolve-versions, compile]
    defaults:
      run:
        working-directory: lib/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: lib/vscode/.nvmrc
          cache: npm
          cache-dependency-path: lib/vscode/package-lock.json

      - name: Cache native modules (Windows)
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/node_modules
            lib/vscode/.build/node_modules_cache
          key: native-modules-windows-${{ hashFiles('lib/vscode/package-lock.json') }}
          restore-keys: |
            native-modules-windows-

      - name: Cache Rust toolchain (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-toolchain-windows-${{ hashFiles('lib/vscode/cli/Cargo.lock') }}
          restore-keys: |
            cargo-toolchain-windows-

      - name: Cache CLI compilation (Windows)
        id: cache-cli-windows
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/cli/target/
          key: cli-windows-${{ hashFiles('patches/*.diff', 'lib/vscode/cli/Cargo.lock', 'lib/vscode/cli/src/**/*.rs', 'lib/vscode/cli/Cargo.toml') }}
          restore-keys: |
            cli-windows-

      - name: Cache built-in extensions
        id: cache-extensions-windows
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/.build/builtInExtensions
            lib/vscode/.build/extensions
          key: extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-${{ hashFiles('patches/*.diff', 'ci/build/update-product.sh', 'ci/build/component-versions.properties', 'lib/vscode/package.json', 'wi/**') }}
          # Partial restore so a cold key doesn't mean a cold cache: this prefix is the exact key minus
          # the file-hash component, so a patch or wi/** edit falls back to the previous run instead of
          # re-downloading every extension.
          #
          # What the fallback does and does not hold fixed, since it is not uniform: Ballerina and MI
          # have their own key fields -- they are the two with a marketplace-vs-vsix source switch, and
          # the version came along with the switch -- so a fallback cannot cross their versions. The
          # streaming-integrator, hurl-client and mcp-server-inspector versions live only inside the
          # dropped hash, so a fallback CAN cross those, as it can WI's. That is safe but not free:
          # download-builtin-extensions re-validates by version string (isUpToDate), which catches those
          # three because their versions move when their contents do. It cannot catch WI, whose version
          # is hand-bumped and stays constant across content changes -- hence the explicit removal in
          # "Install builtin extensions" below.
          restore-keys: |
            extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-

      - name: Download compilation artifact
        uses: actions/download-artifact@v4
        with:
          name: compilation
          path: lib/vscode

      - name: Extract compilation output
        shell: pwsh
        run: tar -xzf compilation.tar.gz

      - name: Download WI extension VSIX
        uses: actions/download-artifact@v4
        with:
          name: wi-extension-vsix
          path: wi/wi-extension

      - name: Install Rsync (Windows)
        shell: pwsh
        run: |
          choco install -y rsync  

      - name: Apply patches (Windows)
        shell: bash
        working-directory: .
        run: |
          # Apply patches using git apply with lenient options
          while IFS= read -r patch || [ -n "$patch" ]; do
            # Trim whitespace from patch filename
            patch=$(echo "$patch" | xargs)
            # Skip empty lines and comments
            [[ -z "$patch" || "$patch" =~ ^[[:space:]]*# ]] && continue
            echo "Applying patch: $patch"
            git apply --whitespace=fix --ignore-whitespace "patches/$patch" || \
            git apply --reject --whitespace=fix "patches/$patch" || \
            (echo "Warning: Failed to apply patch $patch" && exit 1)
          done < patches/series

      - name: Set Ballerina extension version
        if: ${{ needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          echo "BALLERINA_EXTENSION_VERSION=${{ needs.resolve-versions.outputs.ballerina_extension_version }}" >> "$GITHUB_ENV"

      - name: Download archived Ballerina VSIX
        if: ${{ inputs.ballerina_extension_source == 'github' && needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          BALLERINA_VSIX_PATH=$(./ci/download-vsix.sh "wso2/ballerina-vscode" "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" "ballerina-${{ needs.resolve-versions.outputs.ballerina_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.ballerina_extension_tag }}")
          echo "BALLERINA_VSIX_PATH=${BALLERINA_VSIX_PATH}" >> "$GITHUB_ENV"

      - name: Download archived MI VSIX
        if: ${{ inputs.mi_extension_source == 'github' && needs.resolve-versions.outputs.mi_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          MI_VSIX_PATH=$(./ci/download-vsix.sh "wso2/mi-vscode" "${{ needs.resolve-versions.outputs.mi_extension_version }}" "micro-integrator-${{ needs.resolve-versions.outputs.mi_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.mi_extension_tag }}")
          echo "MI_VSIX_PATH=${MI_VSIX_PATH}" >> "$GITHUB_ENV"

      # Deliberately after the cache steps: a timestamped version in
      # hashFiles('ci/build/component-versions.properties') would bust the extensions cache every run.
      - name: Download stamped versions
        uses: actions/download-artifact@v4
        with:
          name: build-versions
          path: .

      - name: Update product.json and branding
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/build/update-product.sh
          ./ci/build/update-product.sh "${{ needs.resolve-versions.outputs.integrator_version }}"

      - name: Install Rust toolchain (Windows)
        shell: pwsh
        run: |
          # Download and install Rust
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
          ./rustup-init.exe -y --default-toolchain stable
          # Add Rust to PATH for this session
          $env:PATH += ";$env:USERPROFILE\.cargo\bin"

      - name: Install OpenSSL (Windows)
        shell: pwsh
        run: |
          # A non-zero exit from a native command is not an error to PowerShell by default, so a
          # failed update would otherwise fall through to bootstrap and install and leave the step
          # green on a stale checkout — the exact failure this step is meant to prevent.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # Install vcpkg if not already present, otherwise update it.
          # The repository and executable must move together: a cached vcpkg.exe can be too old to
          # understand the schema used by the freshly pulled scripts/vcpkg-tools.json.
          if (Test-Path "C:\vcpkg\.git") {
            Write-Host "vcpkg already cloned, fetching latest..."
            cd C:\vcpkg
            # --ff-only refuses to merge, so a diverged or detached preinstalled checkout fails
            # here. Re-clone instead of aborting: the runner image's vcpkg is not ours to repair,
            # and a clean clone reaches the same state.
            try {
              git fetch origin
              git pull --ff-only origin master
            } catch {
              Write-Host "Could not fast-forward the existing vcpkg checkout; re-cloning. $_"
              cd C:\
              Remove-Item -Recurse -Force C:\vcpkg
              git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
              cd C:\vcpkg
            }
          } else {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
            cd C:\vcpkg
          }
          # Always rebuild the executable after moving the checkout. This is idempotent and avoids
          # combining a persisted, old executable with current registry/tool metadata.
          .\bootstrap-vcpkg.bat -disableMetrics
          # Install OpenSSL (vcpkg skips if already installed)
          .\vcpkg.exe install openssl:x64-windows-static
          # Set environment variables for OpenSSL
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:OPENSSL_DIR = "C:\vcpkg\installed\x64-windows-static"
          # Make environment variables persistent for subsequent steps
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\vcpkg\installed\x64-windows-static\lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:\vcpkg\installed\x64-windows-static\include" >> $env:GITHUB_ENV

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci

      - name: Mixin distro modules
        run: |
          node build/azure-pipelines/distro/mixin-npm.ts || true
          node build/azure-pipelines/distro/mixin-quality.ts || true

      - name: Install builtin extensions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.cache-extensions-windows.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Extensions cache hit - using shared cached extensions"
          else
            echo "⬇️ Downloading built-in extensions"
            # wso2.wso2-integrator is pinned in product.json to the hand-bumped version in
            # wi/wi-extension/package.json, which does not move when wi/** content changes.
            # isUpToDate() (lib/vscode/build/lib/builtInExtensions.ts) compares only that version
            # string, so a prefix-restored copy would be judged current and the vsix just built
            # would never be unpacked. Reaching this branch means the exact key missed, so drop it
            # and force a re-unpack.
            rm -rf .build/builtInExtensions/wso2.wso2-integrator
            npm run download-builtin-extensions
          fi

      - name: Download exlporer Dll
        shell: pwsh
        run: node build/win32/explorer-dll-fetcher.ts .build/win32/appx

      - name: Build client (Windows)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run gulp "vscode-win32-x64-min-ci"

      - name: Build CLI (Windows)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          OPENSSL_DIR: C:\vcpkg\installed\x64-windows-static
          OPENSSL_LIB_DIR: C:\vcpkg\installed\x64-windows-static\lib
          OPENSSL_INCLUDE_DIR: C:\vcpkg\installed\x64-windows-static\include
          OPENSSL_STATIC: 1
        run: |
          # Add Rust to PATH
          $env:PATH += ";$env:USERPROFILE\.cargo\bin"
          cd cli
          
          if ("${{ steps.cache-cli-windows.outputs.cache-hit }}" -eq "true") {
            Write-Host "✅ CLI cache hit - checking for cached CLI binary"
            if (Test-Path "./target/release/code.exe") {
              Write-Host "Cached CLI binary found and ready to use"
            } else {
              Write-Host "⚠️ Cache hit but binary missing - rebuilding"
              cargo build --release --bin=code
            }
          } else {
            Write-Host "❌ CLI cache miss - compiling CLI"
            cargo build --release --bin=code
          }
          
          # Verify CLI binary was built
          if (-not (Test-Path "./target/release/code.exe")) {
            Write-Host "CLI binary not found at ./target/release/code.exe" -ForegroundColor Red
            Get-ChildItem -Path ./target -Recurse -Name "code.exe" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Mix in built CLI into client (Windows)
        shell: pwsh
        run: |
          cd cli
          $cliBin = "./target/release/code.exe"
          
          # Get CLI app name from source product.json (not from app bundle)
          $productJson = Get-Content "../product.json" | ConvertFrom-Json
          $cliAppName = $productJson.tunnelApplicationName + ".exe"
          
          # Create bin directory and copy CLI
          $binDir = "../VSCode-win32-x64/bin"
          New-Item -ItemType Directory -Path $binDir -Force
          Copy-Item $cliBin "$binDir/$cliAppName"

      - name: Re-package with CLI (Windows)
        shell: pwsh
        run: |
          # Re-create the zip with the CLI included
          mkdir -p ../artifacts
          $archivePath = "../artifacts/VSCode-win32-x64.zip"
          Remove-Item $archivePath -ErrorAction SilentlyContinue
          Compress-Archive -Path ../VSCode-win32-x64/* -DestinationPath $archivePath -Force

      - name: Upload Windows artifacts
        if: ${{ inputs.build_packed_installers == false }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-win32
          path: |
            lib/artifacts/*
          if-no-files-found: error
      
      - name: Copy Integrator artifact to build directory
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cp ../artifacts/VSCode-win32-x64.zip ../../installers/windows/
      - name: Exclude build workspace from Windows Defender
        if: ${{ inputs.build_packed_installers == true }}
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\installers\windows"
      - name: Enable long paths (Windows)
        if: ${{ inputs.build_packed_installers == true }}
        continue-on-error: true
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
      - name: Build Windows installer packages
        if: ${{ inputs.build_packed_installers == true }}
        shell: pwsh
        run: |
          cd ..\..
          $ROOT_DIR = Get-Location
          Write-Host "Root dir: $ROOT_DIR"
          $BALLERINA_VERSION = "${{ needs.resolve-versions.outputs.ballerina_version }}"
          $BALLERINA_VERSION_FILENAME = $BALLERINA_VERSION -replace '-.*$', ''
          $BALLERINA_URL = "https://github.com/ballerina-platform/ballerina-distribution/releases/download/v${BALLERINA_VERSION}/ballerina-${BALLERINA_VERSION_FILENAME}-swan-lake-windows.zip"
          $ICP_VERSION = "${{ needs.resolve-versions.outputs.icp_version }}"
          $ICP_VERSION_FILENAME = $ICP_VERSION -replace '-.*$', ''
          if ($ICP_VERSION -ne $ICP_VERSION_FILENAME) {
            $ICP_VERSION_FILENAME = "${ICP_VERSION_FILENAME}-SNAPSHOT"
          }
          $ICP_URL = "https://github.com/wso2/integration-control-plane/releases/download/v${ICP_VERSION}/wso2-integration-control-plane-${ICP_VERSION}.zip"
          $JRE_VERSION = "${{ needs.resolve-versions.outputs.ballerina_jre_version }}"
          $JRE_URL = "https://github.com/ballerina-platform/ballerina-custom-jre/releases/download/${JRE_VERSION}/ballerina-jre-win-64-${JRE_VERSION}.zip"
          $INTEGRATOR_VERSION = "${{ needs.resolve-versions.outputs.integrator_version }}"
          cd .\installers\windows
          Invoke-WebRequest -Uri $BALLERINA_URL -OutFile "ballerina.zip"
          Invoke-WebRequest -Uri $ICP_URL -OutFile "icp.zip"
          Invoke-WebRequest -Uri $JRE_URL -OutFile "jre.zip"
          .\build.bat .\ballerina.zip $BALLERINA_VERSION .\VSCode-win32-x64.zip .\icp.zip .\jre.zip $INTEGRATOR_VERSION

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Windows artifacts to S3
        if: ${{ inputs.build_packed_installers == true }}
        shell: bash
        working-directory: .
        run: |
          S3_PATH="s3://${{ secrets.AWS_S3_BUCKET }}/wi/${{ github.run_id }}/"
          aws s3 cp installers/windows/WixPackage/bin/x64/Release/en-US/ "${S3_PATH}" --recursive --exclude "*" --include "*.msi"

      - name: Upload Windows artifacts
        if: ${{ inputs.build_packed_installers == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Product-Integrator-Windows
          path: |
            installers\windows\WixPackage\bin\x64\Release\en-US\*.msi
          if-no-files-found: error
      
      - name: cosign-installer
        if: ${{ inputs.build_packed_installers == true }}
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign the msi installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          cosign sign-blob installers\windows\WixPackage\bin\x64\Release\en-US\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi --output-certificate installers\windows\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi.pem --output-signature installers\windows\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi.sig --yes
      - name: Verify signature of the msi installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          cosign verify-blob installers\windows\WixPackage\bin\x64\Release\en-US\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi --certificate installers\windows\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi.pem --signature installers\windows\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi.sig --certificate-identity=https://github.com/wso2/product-integrator/.github/workflows/build.yml@${{ github.ref }} --certificate-oidc-issuer=https://token.actions.githubusercontent.com

          
      - name: Generate Hashes for msi installer
        if: ${{ inputs.build_packed_installers == true }}
        run: |
          cd ../..
          openssl dgst -sha256 -out installers\windows\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi.sha256 installers\windows\WixPackage\bin\x64\Release\en-US\wso2-integrator-${{ needs.resolve-versions.outputs.integrator_version }}.msi 

      - name: Upload Signatures and Hashes for msi installer
        if: ${{ inputs.build_packed_installers == true }}
        uses: actions/upload-artifact@v4
        with:
          name: Signatures-and-Hashes-MSI
          path: |
            installers\windows\*.pem
            installers\windows\*.sig
            installers\windows\*.sha256
          if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [resolve-versions, compile, build-macos, build-windows, smoke-test, smoke-test-windows]
    if: always() && (needs.compile.result == 'success') && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') && (needs.smoke-test-windows.result == 'success' || needs.smoke-test-windows.result == 'skipped') && (inputs.build_packed_installers == false) && (inputs.publish_tag == '')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create unified release artifact
        run: |
          mkdir -p release-artifacts
          
          # Copy Linux artifacts if available
          if [ -d "all-artifacts/artifacts-linux" ]; then
            cp all-artifacts/artifacts-linux/* release-artifacts/ || true
          fi
          
          # Copy macOS artifacts if available
          if [ -d "all-artifacts/artifacts-darwin-x64" ]; then
            cp all-artifacts/artifacts-darwin-x64/* release-artifacts/ || true
          fi
          if [ -d "all-artifacts/artifacts-darwin-arm64" ]; then
            cp all-artifacts/artifacts-darwin-arm64/* release-artifacts/ || true
          fi
          
          # Copy Windows artifacts if available
          if [ -d "all-artifacts/artifacts-win32" ]; then
            cp all-artifacts/artifacts-win32/* release-artifacts/ || true
          fi
          
          # List all created artifacts
          echo "Created release artifacts:"
          ls -la release-artifacts/

      - name: Upload unified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wso2-integrator-release
          path: release-artifacts/*
          if-no-files-found: warn

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-versions, compile, build-macos, build-windows, smoke-test, smoke-test-windows]
    # A published tag is permanent and user-visible, so every platform that was asked for must have
    # succeeded. `skipped` is allowed for build-macos/build-windows because they are gated on their
    # own inputs, and for smoke-test/smoke-test-windows because run_smoke_tests can turn them off
    # deliberately; a *failed* job of any of these skips this job, and the run is already red from
    # that failure.
    #
    # The smoke_tests_required == false branch (the nightly) is deliberately redundant with the
    # `allow_failure` passed to smoke-test.yml: continue-on-error there should already make the
    # called workflow — and so `needs.smoke-test.result` here — conclude `success` even when a test
    # fails, which would leave this clause unexercised. It is kept as the belt to that pair of braces
    # because the two live in different files and the failure mode is silent: if the conclusion ever
    # propagates as `failure` instead (a GitHub behaviour change, or a smoke-test job that is
    # cancelled rather than failed, which continue-on-error does not cover), the nightly would stop
    # publishing without anything saying why. Do not delete one half without re-testing the other.
    if: |
      always() &&
      (needs.compile.result == 'success') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (inputs.smoke_tests_required == false || (
        (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
        (needs.smoke-test-windows.result == 'success' || needs.smoke-test-windows.result == 'skipped')
      )) &&
      (inputs.publish_tag != '') &&
      (inputs.build_packed_installers == true)
    steps:
      - name: Download Linux DEB artifacts
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-DEB
          path: release-files/
        continue-on-error: true

      - name: Download Signatures and Hashes (DEB)
        uses: actions/download-artifact@v4
        with:
          name: Signatures-and-Hashes-DEB
          path: release-files/
        continue-on-error: true

      - name: Download Linux RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-RPM
          path: release-files/
        continue-on-error: true

      - name: Download Signatures and Hashes (RPM)
        uses: actions/download-artifact@v4
        with:
          name: Signatures-and-Hashes-RPM
          path: release-files/
        continue-on-error: true

      - name: Download Linux TAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-TAR
          path: release-files/
        continue-on-error: true

      - name: Download macOS DMG artifacts (arm64)
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-Darwin-DMG-arm64
          path: release-files/
        continue-on-error: true

      - name: Download macOS DMG artifacts (x64)
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-Darwin-DMG-x64
          path: release-files/
        continue-on-error: true

      - name: Download Signatures and Hashes (MAC arm64)
        uses: actions/download-artifact@v4
        with:
          name: Signatures-and-Hashes-MAC-arm64
          path: release-files/
        continue-on-error: true

      - name: Download Signatures and Hashes (MAC x64)
        uses: actions/download-artifact@v4
        with:
          name: Signatures-and-Hashes-MAC-x64
          path: release-files/
        continue-on-error: true

      - name: Download Windows MSI artifacts
        uses: actions/download-artifact@v4
        with:
          name: Product-Integrator-Windows
          path: release-files/
        continue-on-error: true

      - name: Download Signatures and Hashes (MSI)
        uses: actions/download-artifact@v4
        with:
          name: Signatures-and-Hashes-MSI
          path: release-files/
        continue-on-error: true

      # The WI extension ships as a release asset: for nightly, the rolling tag is how the vsix is
      # distributed (there is no Marketplace / Open VSX publish).
      - name: Download WI extension VSIX
        uses: actions/download-artifact@v4
        with:
          name: wi-extension-vsix
          path: release-files/
        continue-on-error: true

      # The caller chose the tag; all that is derived here is the display name.
      - name: Resolve release name
        id: release-tag
        shell: bash
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          INTEGRATOR_VERSION: ${{ needs.resolve-versions.outputs.integrator_version }}
        run: |
          if [ "${PUBLISH_TAG}" = "nightly" ]; then
            echo "name=WSO2 Integrator Nightly (${INTEGRATOR_VERSION})" >> "$GITHUB_OUTPUT"
          else
            echo "name=WSO2 Integrator ${PUBLISH_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: List release files
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          echo "Files to be released under tag ${PUBLISH_TAG}:"
          ls -la release-files/ || echo "No release files found"

      # Every download above is `continue-on-error` (a skipped platform produces no artifact), so a
      # missing artifact would otherwise publish silently. Assert that everything the inputs asked
      # for actually arrived, and fail the run rather than ship a partial release.
      - name: Verify release assets
        shell: bash
        env:
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
        run: |
          shopt -s nullglob
          missing=()
          require() {
            local label="$1"; shift
            local found=("$@")
            [ ${#found[@]} -gt 0 ] || missing+=("${label}")
          }

          require "Linux .deb"          release-files/*.deb
          require "Linux .rpm"          release-files/*.rpm
          require "Linux .tar.gz"       release-files/*.tar.gz
          require "WI extension .vsix"  release-files/*.vsix
          if [ "${BUILD_MACOS}" = "true" ]; then
            require "macOS arm64 .dmg"  release-files/*arm64.dmg
            require "macOS x64 .dmg"    release-files/*x64.dmg
          fi
          if [ "${BUILD_WINDOWS}" = "true" ]; then
            require "Windows .msi"      release-files/*.msi
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Error: refusing to publish an incomplete release. Missing:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All expected release assets are present."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.publish_tag }}
          name: ${{ steps.release-tag.outputs.name }}
          # Callers that prepared a branch pass its SHA as both `ref` and `target_commitish`, so the
          # tag points at the very commit that was compiled rather than at the ref the workflow was
          # started from.
          target_commitish: ${{ inputs.target_commitish != '' && inputs.target_commitish || github.sha }}
          draft: false
          prerelease: ${{ inputs.is_prerelease }}
          # Only a non-pre-release becomes the repository Latest.
          make_latest: ${{ !inputs.is_prerelease }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A `nightly*` tag is rolling: every build's filenames carry a fresh timestamp, so the upload
      # above adds to the previous build's assets instead of replacing them. This step verifies the
      # new set fully landed, moves the tag to the current commit (action-gh-release only creates a
      # tag that doesn't yet exist), then removes the superseded assets — in that order, so the
      # release is never left incomplete or empty.
      #
      # The gate is a prefix match, not `== 'nightly'`, so a disposable `nightly-test` dispatch can
      # exercise the delete loop without touching the production tag. It stays false for the other
      # two callers: release.yml passes `v<version>` and dev-build.yml passes ''.
      #
      # PUBLISH_TAG is bound through `env`, not interpolated directly, so a tag value containing
      # shell syntax can't change the commands being run.
      - name: Roll the nightly tag and drop superseded assets
        if: ${{ startsWith(inputs.publish_tag, 'nightly') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          TARGET_SHA: ${{ inputs.target_commitish != '' && inputs.target_commitish || github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          published=$(for file in release-files/*; do basename "${file}"; done | sort)
          if [ -z "${published}" ]; then
            echo "Error: no files were published, so there is nothing to supersede." >&2
            exit 1
          fi
          attached=$(gh release view "${PUBLISH_TAG}" --json assets --jq '.assets[].name' \
            | sed '/^$/d' | sort)

          # An upload that silently dropped a file would otherwise be "fixed" by deleting the
          # previous, complete set. Bail out and leave both sets attached instead.
          missing=$(comm -23 <(printf '%s\n' "${published}") <(printf '%s\n' "${attached}"))
          if [ -n "${missing}" ]; then
            echo "Error: these files did not reach the ${PUBLISH_TAG} release:" >&2
            while IFS= read -r name; do
              echo "  - ${name}" >&2
            done <<< "${missing}"
            echo "       Keeping the previous assets; the release still holds a full set." >&2
            exit 1
          fi

          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${PUBLISH_TAG}" \
            -f sha="${TARGET_SHA}" -F force=true >/dev/null
          echo "${PUBLISH_TAG} now tags ${TARGET_SHA}."

          superseded=$(comm -13 <(printf '%s\n' "${published}") <(printf '%s\n' "${attached}"))
          if [ -z "${superseded}" ]; then
            echo "No superseded assets to remove."
            exit 0
          fi
          while IFS= read -r name; do
            gh release delete-asset "${PUBLISH_TAG}" "${name}" --yes
            echo "Removed superseded asset ${name}"
          done <<< "${superseded}"
