name: Compile

on: 
  workflow_call:
    inputs: 
      runOnAWS:
        default: false
        type: boolean
      awsRunnerId:
        default: 'codebuild-wso2_product-integrator-${{ github.run_id }}-${{ github.run_attempt }}'
        type: string
      build_packed_installers:
        description: 'Whether to build Ballerina, ICP, and Integrator packed installers'
        default: true
        required:  true
        type: boolean
      ballerina_extension_source:
        description: 'Choose whether to bundle Ballerina from GitHub VSIX or use marketplace flow'
        default: 'marketplace'
        required: false
        type: string
      mi_extension_source:
        description: 'Choose whether to bundle MI from GitHub VSIX or use marketplace flow'
        default: 'marketplace'
        required: false
        type: string
      versions_artifact:
        description: 'Artifact holding the already-stamped component-versions.properties and wi-extension package.json. Empty (a direct call from pr-ci.yml) means stamp here instead.'
        default: ''
        required: false
        type: string
      # `github.ref` is the caller's triggering ref under `workflow_call`, which is not the branch
      # build.yml's dispatchers prepare. build.yml forwards its own `ref` here; pr-ci.yml passes
      # nothing and keeps building the ref that triggered it.
      ref:
        description: 'Ref or SHA to build. Empty builds the ref this workflow was called from.'
        default: ''
        required: false
        type: string
      is_prerelease:
        description: 'Package the WI extension vsix as a VS Code pre-release (embeds the Microsoft.VisualStudio.Code.PreRelease manifest property).'
        default: false
        required: false
        type: boolean

permissions:
  id-token: write
  contents: write     

jobs:
  resolve-versions:
    name: Resolve Component Versions
    runs-on: ubuntu-latest
    outputs:
      ballerina_version: ${{ steps.read-versions.outputs.ballerina_version }}
      ballerina_extension_version: ${{ steps.read-versions.outputs.ballerina_extension_version }}
      ballerina_extension_tag: ${{ steps.read-versions.outputs.ballerina_extension_tag }}
      mi_extension_version: ${{ steps.read-versions.outputs.mi_extension_version }}
      mi_extension_tag: ${{ steps.read-versions.outputs.mi_extension_tag }}
      icp_version: ${{ steps.read-versions.outputs.icp_version }}
      integrator_version: ${{ steps.read-versions.outputs.integrator_version }}
      ballerina_jre_version: ${{ steps.read-versions.outputs.ballerina_jre_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download stamped versions
        if: ${{ inputs.versions_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.versions_artifact }}
          path: .

      # Called directly (pr-ci.yml): nothing has stamped yet, and `1.2.0-SNAPSHOT` is not a valid
      # VS Code extension version, so the vsix would fail to package. Stamp here and publish the
      # result so the compile job below builds exactly these versions.
      - name: Stamp versions
        if: ${{ inputs.versions_artifact == '' }}
        shell: bash
        run: |
          chmod +x ./ci/build/apply-version.sh
          ./ci/build/apply-version.sh

      - name: Upload stamped versions
        if: ${{ inputs.versions_artifact == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: |
            ci/build/component-versions.properties
            wi/wi-extension/package.json
          if-no-files-found: error

      - name: Read versions file
        id: read-versions
        shell: bash
        run: |
          VERSIONS_FILE="ci/build/component-versions.properties"
          if [ ! -f "${VERSIONS_FILE}" ]; then
            echo "Error: ${VERSIONS_FILE} does not exist." >&2
            exit 1
          fi

          read_property() {
            local key="$1"
            awk -F= -v property_key="$key" '$1 == property_key { print substr($0, index($0, "=") + 1); exit }' "${VERSIONS_FILE}" | tr -d '\r'
          }

          BALLERINA_VERSION=$(read_property "ballerina.version")
          BALLERINA_EXTENSION_VERSION=$(read_property "ballerina.extension.version")
          MI_EXTENSION_VERSION=$(read_property "wso2.micro-integrator.extension.version")
          ICP_VERSION=$(read_property "icp.version")
          INTEGRATOR_VERSION=$(read_property "integrator.version")
          BALLERINA_JRE_VERSION=$(read_property "ballerina.jre.version")

          # A `<key>.tag` companion is only present when the upstream release tag cannot be derived
          # from the version (a rolling tag such as wso2/ballerina-vscode's `nightly`, pinned by
          # ci/build/resolve-nightly-versions.sh). Otherwise the conventional v<version> tag applies.
          BALLERINA_EXTENSION_TAG=$(read_property "ballerina.extension.version.tag")
          MI_EXTENSION_TAG=$(read_property "wso2.micro-integrator.extension.version.tag")

          if [ -z "${BALLERINA_VERSION}" ] || [ -z "${ICP_VERSION}" ] || [ -z "${INTEGRATOR_VERSION}" ] || [ -z "${BALLERINA_JRE_VERSION}" ]; then
            echo "Error: ballerina.version, icp.version, integrator.version, and ballerina.jre.version must be set in ${VERSIONS_FILE}." >&2
            exit 1
          fi

          if [[ -n "${BALLERINA_EXTENSION_VERSION}" && "${BALLERINA_EXTENSION_VERSION}" =~ ^[vV] ]]; then
            echo "Error: ballerina.extension.version must be provided without a leading v." >&2
            exit 1
          fi

          if [[ -n "${MI_EXTENSION_VERSION}" && "${MI_EXTENSION_VERSION}" =~ ^[vV] ]]; then
            echo "Error: wso2.micro-integrator.extension.version must be provided without a leading v." >&2
            exit 1
          fi

          echo "ballerina_version=${BALLERINA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_extension_version=${BALLERINA_EXTENSION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_extension_tag=${BALLERINA_EXTENSION_TAG:-v${BALLERINA_EXTENSION_VERSION}}" >> "$GITHUB_OUTPUT"
          echo "mi_extension_version=${MI_EXTENSION_VERSION}" >> "$GITHUB_OUTPUT"
          echo "mi_extension_tag=${MI_EXTENSION_TAG:-v${MI_EXTENSION_VERSION}}" >> "$GITHUB_OUTPUT"
          echo "icp_version=${ICP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "integrator_version=${INTEGRATOR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ballerina_jre_version=${BALLERINA_JRE_VERSION}" >> "$GITHUB_OUTPUT"

  validate-Inputs:
    needs: resolve-versions
    if: ${{ inputs.build_packed_installers == true }}
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate required inputs
        run: |
          if [ -z "${{ needs.resolve-versions.outputs.ballerina_version }}" ] || [ -z "${{ needs.resolve-versions.outputs.icp_version }}" ] || [ -z "${{ needs.resolve-versions.outputs.integrator_version }}" ] || [ -z "${{ needs.resolve-versions.outputs.ballerina_jre_version }}" ]; then
            echo "Error: ballerina_version, icp_version, integrator_version, and ballerina_jre_version must not be empty."
            exit 1
          elif [ "${{ inputs.ballerina_extension_source }}" = "github" ] && [ -z "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" ]; then
            echo "Error: ballerina_extension_version must not be empty when ballerina_extension_source is set to github."
            exit 1
          elif [ "${{ inputs.mi_extension_source }}" = "github" ] && [ -z "${{ needs.resolve-versions.outputs.mi_extension_version }}" ]; then
            echo "Error: mi_extension_version must not be empty when mi_extension_source is set to github."
            exit 1
          elif [ -n "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" ] && [[ "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" =~ ^[vV] ]]; then
            echo "Error: ballerina_extension_version must be provided without a leading v. Example: 4.5.0"
            exit 1
          else
            echo "All required versions from component-versions.properties are available."
          fi
  compile:
    needs: resolve-versions
    name: Build repo
    # 90 gives a fully cold-cache build room to finish and reach the post-step that SAVES the
    # caches; warm runs finish well under this. 45 was too tight for a cold build, and a
    # timeout there cancels the job before caches are saved -> every run stays cold (vicious cycle).
    timeout-minutes: 90
    runs-on: ${{ inputs.runOnAWS && inputs.awsRunnerId || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: lib/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Validate Ballerina extension input contract
        shell: bash
        working-directory: .
        run: |
          if [ "${{ inputs.ballerina_extension_source }}" = "github" ] && [ -z "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" ]; then
            echo "Error: ballerina_extension_version is required when ballerina_extension_source=github."
            exit 1
          fi

          if [[ -n "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" && "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" =~ ^[vV] ]]; then
            echo "Error: ballerina_extension_version must be provided without a leading v. Example: 4.5.0"
            exit 1
          fi

      - name: Validate MI extension input contract
        shell: bash
        working-directory: .
        run: |
          if [ "${{ inputs.mi_extension_source }}" = "github" ] && [ -z "${{ needs.resolve-versions.outputs.mi_extension_version }}" ]; then
            echo "Error: mi_extension_version is required when mi_extension_source=github."
            exit 1
          fi

          if [[ -n "${{ needs.resolve-versions.outputs.mi_extension_version }}" && "${{ needs.resolve-versions.outputs.mi_extension_version }}" =~ ^[vV] ]]; then
            echo "Error: mi_extension_version must be provided without a leading v. Example: 4.5.0"
            exit 1
          fi    

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: lib/vscode/.nvmrc
          cache: npm
          cache-dependency-path: lib/vscode/package-lock.json

      - name: Setup Rush
        uses: gigara/setup-rush@v1.2.0
        with:
          pnpm: 10.11.0

      # TODO: Enable TypeScript cache when stable    
      # - name: Cache TypeScript compilation
      #   id: cache-typescript
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       lib/vscode/out
      #       lib/vscode/out-*
      #       lib/vscode/.build/extensions
      #       lib/vscode/.build/builtInExtensions
      #     key: typescript-${{ runner.os }}-${{ hashFiles('patches/*.diff', 'ci/build/update-product.sh', 'lib/vscode/package.json', 'lib/vscode/package-lock.json') }}
      #     restore-keys: |
      #       typescript-${{ runner.os }}-

      - name: Cache built-in extensions
        id: cache-extensions
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/.build/builtInExtensions
            lib/vscode/.build/extensions
          key: extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-${{ hashFiles('patches/*.diff', 'ci/build/update-product.sh', 'ci/build/component-versions.properties', 'lib/vscode/package.json', 'wi/**') }}
          # Partial restore so a cold key doesn't mean a cold cache: this prefix is the exact key minus
          # the file-hash component, so a patch or wi/** edit falls back to the previous run instead of
          # re-downloading every extension.
          #
          # What the fallback does and does not hold fixed, since it is not uniform: Ballerina and MI
          # have their own key fields -- they are the two with a marketplace-vs-vsix source switch, and
          # the version came along with the switch -- so a fallback cannot cross their versions. The
          # streaming-integrator, hurl-client and mcp-server-inspector versions live only inside the
          # dropped hash, so a fallback CAN cross those, as it can WI's. That is safe but not free:
          # download-builtin-extensions re-validates by version string (isUpToDate), which catches those
          # three because their versions move when their contents do. It cannot catch WI, whose version
          # is hand-bumped and stays constant across content changes -- hence the explicit removal in
          # "Install builtin extensions" below.
          restore-keys: |
            extensions-shared-${{ inputs.ballerina_extension_source }}-${{ needs.resolve-versions.outputs.ballerina_extension_version }}-${{ inputs.mi_extension_source }}-${{ needs.resolve-versions.outputs.mi_extension_version }}-

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-toolchain-${{ runner.os }}-${{ hashFiles('lib/vscode/cli/Cargo.lock') }}
          restore-keys: |
            cargo-toolchain-${{ runner.os }}-

      - name: Cache CLI compilation
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/cli/target/
          key: cli-${{ runner.os }}-${{ hashFiles('patches/*.diff', 'lib/vscode/cli/Cargo.lock', 'lib/vscode/cli/src/**/*.rs', 'lib/vscode/cli/Cargo.toml') }}
          restore-keys: |
            cli-${{ runner.os }}-

      - name: Cache Linux sysroots
        uses: actions/cache@v4
        with:
          path: |
            lib/vscode/.build/sysroots
          key: sysroots-${{ runner.os }}-glibc-2.28-gcc
          restore-keys: |
            sysroots-${{ runner.os }}-

      # The runner image ships a pinned apt index. Once the archive supersedes a
      # package (e.g. a krb5 security update), the old .deb is dropped from the pool
      # and the stale index resolves to a 404. cache-apt-pkgs-action does not refresh
      # the index itself, so do it here.
      - name: Refresh apt package index
        run: sudo apt-get update

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 quilt
          # Bumped from 1.0 to invalidate caches poisoned by the 404 above: when the
          # fetch failed, the action still saved an empty (2 KB) cache under the old
          # key, so every later run got a cache hit that installed nothing and failed
          # downstream with "quilt: command not found".
          version: 1.1

      - name: Verify apt packages installed
        run: |
          for c in quilt g++; do
            command -v "$c" >/dev/null || { echo "::error::$c missing after apt install step"; exit 1; }
          done

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-gnu
  
      - name: Get latest lib/vscode rev
        id: vscode-rev
        run: echo "rev=$(git rev-parse HEAD:./lib/vscode)" >> $GITHUB_OUTPUT
  
      - name: Fetch prebuilt Code package from cache
        id: cache-vscode
        uses: actions/cache@v4
        with:
          path: lib/vscode-reh-web-*
          key: vscode-reh-package-v1-${{ steps.vscode-rev.outputs.rev }}-${{ hashFiles('patches/*.diff', 'ci/build/update-product.sh', 'lib/vscode/package.json') }}

      - name: Set Ballerina extension version
        if: ${{ needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          echo "BALLERINA_EXTENSION_VERSION=${{ needs.resolve-versions.outputs.ballerina_extension_version }}" >> "$GITHUB_ENV"

      - name: Download archived Ballerina VSIX
        if: ${{ inputs.ballerina_extension_source == 'github' && needs.resolve-versions.outputs.ballerina_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          BALLERINA_VSIX_PATH=$(./ci/download-vsix.sh "wso2/ballerina-vscode" "${{ needs.resolve-versions.outputs.ballerina_extension_version }}" "ballerina-${{ needs.resolve-versions.outputs.ballerina_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.ballerina_extension_tag }}")
          echo "BALLERINA_VSIX_PATH=${BALLERINA_VSIX_PATH}" >> "$GITHUB_ENV"
  
      - name: Set MI extension version
        if: ${{ needs.resolve-versions.outputs.mi_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          echo "MI_EXTENSION_VERSION=${{ needs.resolve-versions.outputs.mi_extension_version }}" >> "$GITHUB_ENV"

      - name: Download archived MI VSIX
        if: ${{ inputs.mi_extension_source == 'github' && needs.resolve-versions.outputs.mi_extension_version != '' }}
        shell: bash
        working-directory: .
        run: |
          chmod +x ./ci/download-vsix.sh
          MI_VSIX_PATH=$(./ci/download-vsix.sh "wso2/mi-vscode" "${{ needs.resolve-versions.outputs.mi_extension_version }}" "micro-integrator-${{ needs.resolve-versions.outputs.mi_extension_version }}.vsix" "$PWD" "${{ needs.resolve-versions.outputs.mi_extension_tag }}")
          echo "MI_VSIX_PATH=${MI_VSIX_PATH}" >> "$GITHUB_ENV"

      # Deliberately after the cache steps: a timestamped version in
      # hashFiles('ci/build/component-versions.properties') would bust the extensions cache every run.
      # This also lands before `rush build`, so the .vsix filename, product.json and the installer
      # names all carry the same stamp.
      - name: Download stamped versions
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.versions_artifact != '' && inputs.versions_artifact || 'versions' }}
          path: .

      - name: Update product.json and branding
        working-directory: .
        run: |
          chmod +x ./ci/build/update-product.sh
          ./ci/build/update-product.sh "${{ needs.resolve-versions.outputs.integrator_version }}"

      # Apply the quilt patches explicitly (from the repo root) instead of relying on the
      # rush `preRushBuild` apply-patches hook, whose output rush suppresses and whose failure
      # rush treats as non-fatal — leaving vscode unpatched and later breaking the build
      # (e.g. the vsix checksum check that disableVsixChecksumCheck is meant to disable).
      # Running quilt directly here surfaces any patch error and guarantees patches are applied.
      - name: Apply patches
        working-directory: .
        run: quilt push -a

      - name: Copy .env.example to .env
        shell: bash
        working-directory: .
        run: |
          find . -type f -name ".env.example" | while read example; do
            envfile="$(dirname "$example")/.env"
            cp "$example" "$envfile"
          done

      - name: Setup WI
        uses: gigara/setup-rush@v1.2.0

      - name: Build WI extension
        working-directory: .
        env:
          # The wso2-integrator build downloads Choreo CLI binaries from the GitHub API
          # (scripts/download-choreo-cli.js). Without a token those calls are unauthenticated
          # and hit the 60 req/hour limit -> "HTTP 403: rate limit exceeded". Authenticate to
          # raise the limit to 5000/hour, matching the other steps in this job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by external/wso2-vscode-extensions/workspaces/common-libs/scripts/package-vsix.js
          # to decide whether to `vsce package --pre-release`. This is the only place that flag is
          # set, so the vsix's embedded pre-release state always matches this input.
          isPreRelease: ${{ inputs.is_prerelease }}
        run: |
          node common/scripts/install-run-rush.js build --verbose

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci

      - name: Mixin distro modules
        run: |
          node build/azure-pipelines/distro/mixin-npm.ts || true
          node build/azure-pipelines/distro/mixin-quality.ts || true

      - name: Install builtin extensions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_HIT: ${{ steps.cache-extensions.outputs.cache-hit }}
          BALLERINA_EXTENSION_VERSION: ${{ needs.resolve-versions.outputs.ballerina_extension_version }}
          BALLERINA_EXTENSION_TAG: ${{ needs.resolve-versions.outputs.ballerina_extension_tag }}
          MI_EXTENSION_VERSION: ${{ needs.resolve-versions.outputs.mi_extension_version }}
          MI_EXTENSION_TAG: ${{ needs.resolve-versions.outputs.mi_extension_tag }}
        run: |
          # An extension pinned to a ROLLING upstream tag (the nightly's `nightly`) keeps one version
          # string while its content changes daily, so isUpToDate()
          # (lib/vscode/build/lib/builtInExtensions.ts) judges any cached copy current and never
          # unpacks the vsix that was just downloaded — the nightly would ship the first night's
          # extension forever. The `<key>.tag` companion is written by
          # ci/build/resolve-nightly-versions.sh ONLY when the tag is not v<version>, which is
          # exactly the rolling case, so it is the precise signal here.
          #
          # These must force the download path rather than just be deleted: on a cache hit
          # download-builtin-extensions never runs, so deleting without downloading would leave the
          # extension missing altogether.
          rolling=()
          if [ -n "${BALLERINA_EXTENSION_VERSION}" ] && [ "${BALLERINA_EXTENSION_TAG}" != "v${BALLERINA_EXTENSION_VERSION}" ]; then
            rolling+=(wso2.ballerina)
          fi
          if [ -n "${MI_EXTENSION_VERSION}" ] && [ "${MI_EXTENSION_TAG}" != "v${MI_EXTENSION_VERSION}" ]; then
            rolling+=(wso2.micro-integrator)
          fi

          if [ "${CACHE_HIT}" = "true" ] && [ ${#rolling[@]} -eq 0 ]; then
            echo "✅ Extensions cache hit - using cached extensions"
          else
            echo "⬇️ Downloading built-in extensions"
            # wso2.wso2-integrator is pinned in product.json to the hand-bumped version in
            # wi/wi-extension/package.json, which does not move when wi/** content changes.
            # isUpToDate() compares only that version string, so a prefix-restored copy would be
            # judged current and the vsix just built would never be unpacked. Reaching this branch
            # means the exact key missed, so drop it and force a re-unpack.
            rm -rf .build/builtInExtensions/wso2.wso2-integrator
            for ext in "${rolling[@]}"; do
              echo "   dropping ${ext}: pinned to a rolling tag, so its version cannot prove freshness"
              rm -rf ".build/builtInExtensions/${ext}"
            done
            npm run download-builtin-extensions
          fi

      - name: Compile (with cache optimization)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.cache-typescript.outputs.cache-hit }}" = "true" ]; then
            echo "✅ TypeScript cache hit - using cached compilation"
            echo "Skipping core compilation, running validation only"
            npm run compile-extensions-build
            npm exec -- npm-run-all -lp eslint vscode-dts-compile-check
            npm exec -- npm-run-all -ls valid-layers-check define-class-fields-check tsec-compile-check
          else
            echo "❌ TypeScript cache miss - full compilation required"
            echo "Running complete compilation pipeline"
            npm run core-ci
            # patches/increaseHeap.diff caps the node heap for three of these five checks:
            # tsec-compile-check at 8192 MB, define-class-fields-check at 4096 then 8192, and
            # valid-layers-check at 4096. Running two capped checks at once exceeds the runner and
            # the kernel OOM-kills one, surfacing as a bare exit 137 with no useful log. So the
            # three capped checks run serially (-ls) and only the two uncapped ones -- eslint and
            # vscode-dts-compile-check, the latter being tsgo -- run in parallel.
            npm exec -- npm-run-all -lp eslint vscode-dts-compile-check
            npm exec -- npm-run-all -ls valid-layers-check define-class-fields-check tsec-compile-check
          fi

      - name: Compress compilation artifact
        run: |
          tar -cz --exclude='.build/node_modules_cache' --exclude='.build/node_modules_list.txt' --exclude='.build/distro' -f ../compilation.tar.gz $(ls -d .build out-* test/integration/browser/out test/smoke/out test/automation/out 2>/dev/null)

      - name: Build client (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run gulp vscode-linux-x64-min-ci
          ARCHIVE_PATH=../artifacts/vscode-linux-x64.tar.gz
          mkdir -p ../artifacts
          tar -czf "$ARCHIVE_PATH" -C .. VSCode-linux-x64
      
      - name: Copy Integrator artifact to build directories
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cp ../artifacts/vscode-linux-x64.tar.gz ../../installers/linux-deb/
          cp ../artifacts/vscode-linux-x64.tar.gz ../../installers/linux-rpm/
          cp ../artifacts/vscode-linux-x64.tar.gz ../../installers/linux-tar/

      - name: Build Linux packages - deb
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cd ../..
          ROOT_DIR=$(pwd)
          echo "Root dir: ${ROOT_DIR}"
          BALLERINA_VERSION="${{ needs.resolve-versions.outputs.ballerina_version }}"
          BALLERINA_VERSION_FILENAME="${BALLERINA_VERSION%-*}"
          BALLERINA_URL="https://github.com/ballerina-platform/ballerina-distribution/releases/download/v${BALLERINA_VERSION}/ballerina-${BALLERINA_VERSION_FILENAME}-swan-lake-linux.zip"
          ICP_VERSION="${{ needs.resolve-versions.outputs.icp_version }}"
