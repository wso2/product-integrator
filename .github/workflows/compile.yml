          wget -O icp.zip "$ICP_URL"
          wget -O jre.zip "$JRE_URL"
          ./build.sh ballerina.zip $BALLERINA_VERSION vscode-linux-x64.tar.gz icp.zip jre.zip $INTEGRATOR_VERSION
