          ./build.sh ballerina.zip $BALLERINA_VERSION vscode-linux-x64.tar.gz icp.zip jre.zip $INTEGRATOR_VERSION
          cd ${ROOT_DIR}
      - name: Upload RPM artifacts
        if: ${{ inputs.build_packed_installers == true}}
        uses: actions/upload-artifact@v4
        with:
          name: Product-Integrator-RPM
          path: |
            installers/linux-rpm/*.rpm
          if-no-files-found: error
        
      - name: Build Linux packages - tar
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cd ../..
          ROOT_DIR=$(pwd)
          echo "Root dir: ${ROOT_DIR}"
          BALLERINA_VERSION="${{ needs.resolve-versions.outputs.ballerina_version }}"
          BALLERINA_VERSION_FILENAME="${BALLERINA_VERSION%-*}"
          BALLERINA_URL="https://github.com/ballerina-platform/ballerina-distribution/releases/download/v${BALLERINA_VERSION}/ballerina-${BALLERINA_VERSION_FILENAME}-swan-lake-linux.zip"
          ICP_VERSION="${{ needs.resolve-versions.outputs.icp_version }}"
          ICP_VERSION_FILENAME="${ICP_VERSION%-*}"
          if [ "$ICP_VERSION" != "$ICP_VERSION_FILENAME" ]; then
            ICP_VERSION_FILENAME="${ICP_VERSION_FILENAME}-SNAPSHOT"
          fi
          ICP_URL="https://github.com/wso2/integration-control-plane/releases/download/v${ICP_VERSION}/wso2-integration-control-plane-${ICP_VERSION}.zip"
          JRE_VERSION="${{ needs.resolve-versions.outputs.ballerina_jre_version }}"
          JRE_URL="https://github.com/ballerina-platform/ballerina-custom-jre/releases/download/${JRE_VERSION}/ballerina-jre-linux-64-${JRE_VERSION}.zip"
          INTEGRATOR_VERSION="${{ needs.resolve-versions.outputs.integrator_version }}"
          cd ./installers/linux-tar
          wget -O ballerina.zip "$BALLERINA_URL"
          wget -O icp.zip "$ICP_URL"
          wget -O jre.zip "$JRE_URL"
          ./build.sh ballerina.zip $BALLERINA_VERSION vscode-linux-x64.tar.gz icp.zip jre.zip $INTEGRATOR_VERSION
          cd ${ROOT_DIR}
      - name: Upload TAR artifacts
        if: ${{ inputs.build_packed_installers == true}}
        uses: actions/upload-artifact@v4
        with:
          name: Product-Integrator-TAR
          path: |
            installers/linux-tar/wso2-integrator-*.tar.gz
          if-no-files-found: error
        
      - name: cosign-installer
        if: ${{ inputs.build_packed_installers == true}}
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign the deb, rpm installers
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cd ../..
          INTEGRATOR_VERSION="${{ needs.resolve-versions.outputs.integrator_version }}"
          if [[ "$INTEGRATOR_VERSION" == *"-"* ]]; then
            RPM_RELEASE="${INTEGRATOR_VERSION#*-}"
            RPM_VERSION="${INTEGRATOR_VERSION%-*}"
          else
            RPM_RELEASE="1"
            RPM_VERSION="$INTEGRATOR_VERSION"
          fi
          cosign sign-blob installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb --output-certificate installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb.pem --output-signature installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb.sig --yes
          cosign sign-blob installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm --output-certificate installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm.pem --output-signature installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm.sig --yes
      - name: Verify signature of the deb, rpm installers
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cd ../..
          INTEGRATOR_VERSION="${{ needs.resolve-versions.outputs.integrator_version }}"
          if [[ "$INTEGRATOR_VERSION" == *"-"* ]]; then
            RPM_RELEASE="${INTEGRATOR_VERSION#*-}"
            RPM_VERSION="${INTEGRATOR_VERSION%-*}"
          else
            RPM_RELEASE="1"
            RPM_VERSION="$INTEGRATOR_VERSION"
          fi
          cosign verify-blob installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb --certificate installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb.pem --signature installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb.sig --certificate-identity=https://github.com/wso2/product-integrator/.github/workflows/compile.yml@${{ github.ref }} --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          cosign verify-blob installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm --certificate installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm.pem --signature installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm.sig --certificate-identity=https://github.com/wso2/product-integrator/.github/workflows/compile.yml@${{ github.ref }} --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          
      - name: Generate Hashes for deb, rpm installers
        if: ${{ inputs.build_packed_installers == true}}
        run: |
          cd ../..
          INTEGRATOR_VERSION="${{ needs.resolve-versions.outputs.integrator_version }}"
          if [[ "$INTEGRATOR_VERSION" == *"-"* ]]; then
            RPM_RELEASE="${INTEGRATOR_VERSION#*-}"
            RPM_VERSION="${INTEGRATOR_VERSION%-*}"
          else
            RPM_RELEASE="1"
            RPM_VERSION="$INTEGRATOR_VERSION"
          fi
          openssl dgst -sha256 -out installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb.sha256 installers/linux-deb/wso2-integrator_${INTEGRATOR_VERSION}_amd64.deb
          openssl dgst -sha256 -out installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm.sha256 installers/linux-rpm/wso2-integrator-${RPM_VERSION}-${RPM_RELEASE}.x86_64.rpm

      - name: Upload Signatures and Hashes for deb installer
        if: ${{ inputs.build_packed_installers == true}}
        uses: actions/upload-artifact@v4
        with:
          name: Signatures-and-Hashes-DEB
          path: |
            installers/linux-deb/*.pem
            installers/linux-deb/*.sig
            installers/linux-deb/*.sha256
          if-no-files-found: error
        
      - name: Upload Signatures and Hashes for rpm installer
        if: ${{ inputs.build_packed_installers == true}}
        uses: actions/upload-artifact@v4  
        with:
          name: Signatures-and-Hashes-RPM
          path: |
            installers/linux-rpm/*.pem
            installers/linux-rpm/*.sig
            installers/linux-rpm/*.sha256
          if-no-files-found: error


      - name: Build CLI (Linux)
        if: ${{ inputs.build_packed_installers == false}}
        run: |
          source "$HOME/.cargo/env"
          cd cli
          if [ "${{ steps.cache-cli.outputs.cache-hit }}" = "true" ]; then
            echo "✅ CLI cache hit - using cached CLI binary"
            # Verify the binary exists and is executable
            if [ -f "./target/release/code" ]; then
              echo "Cached CLI binary found and ready to use"
            else
              echo "⚠️ Cache hit but binary missing - rebuilding"
              cargo build --release --bin=code
            fi
          else
            echo "❌ CLI cache miss - compiling CLI"
            cargo build --release --bin=code
          fi

      - name: Mix in built CLI into client (Linux)
        if: ${{ inputs.build_packed_installers == false}}
        run: |
          set -e
          CLI_BIN=./cli/target/release/code
          if [ ! -f "$CLI_BIN" ]; then
            echo "CLI binary not found at $CLI_BIN" >&2
            find ./cli/target -type f -name code 2>/dev/null || true
            exit 1
          fi
          CLI_APP_NAME=$(node -p "require('../VSCode-linux-x64/resources/app/product.json').tunnelApplicationName")
          mkdir -p ../VSCode-linux-x64/bin
          cp "$CLI_BIN" "../VSCode-linux-x64/bin/$CLI_APP_NAME"
          chmod +x "../VSCode-linux-x64/bin/$CLI_APP_NAME"

      - name: Build Linux packages - deb (only Integrator)
        if: ${{ inputs.build_packed_installers == false}}
        env:
          VSCODE_ARCH: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # DEB build
          npm run gulp "vscode-linux-$VSCODE_ARCH-prepare-deb"
          npm run gulp "vscode-linux-$VSCODE_ARCH-build-deb"

          # Copy outputs
          cp .build/linux/deb/*/deb/*.deb ../artifacts/ || true

      - name: Build Linux packages - rpm (only Integrator)
        if: ${{ inputs.build_packed_installers == false}}
        env:
          VSCODE_ARCH: x64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TRIPLE=""
          if [ "$VSCODE_ARCH" == "x64" ]; then
            TRIPLE="x86_64-linux-gnu"
          elif [ "$VSCODE_ARCH" == "arm64" ]; then
            TRIPLE="aarch64-linux-gnu"
          elif [ "$VSCODE_ARCH" == "armhf" ]; then
            TRIPLE="arm-rpi-linux-gnueabihf"
          fi
          export VSCODE_SYSROOT_DIR=.build/sysroots/glibc-2.28-gcc-10.5.0
          export STRIP="$VSCODE_SYSROOT_DIR/$TRIPLE/$TRIPLE/bin/strip"
          npm run gulp "vscode-linux-$VSCODE_ARCH-prepare-rpm"
          npm run gulp "vscode-linux-$VSCODE_ARCH-build-rpm"

          # Copy outputs
          cp .build/linux/rpm/*/*.rpm ../artifacts/ || true

      - name: Upload Linux artifacts (only Integrator)
        if: ${{ inputs.build_packed_installers == false && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            lib/artifacts/*.tar.gz
          if-no-files-found: error

      - name: Upload compilation artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: compilation
          path: lib/compilation.tar.gz
          if-no-files-found: error

      - name: Upload WI extension VSIX
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: wi-extension-vsix
          path: wi/wi-extension/wso2-integrator-*.vsix
          if-no-files-found: error

      
      - name: Login to AWS
        if: ${{ inputs.build_packed_installers == true && github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Upload linux artifacts to S3
        if: ${{ inputs.build_packed_installers == true && github.event_name != 'pull_request' }}
        working-directory: .
        run: |
          S3_PATH="s3://${{ secrets.AWS_S3_BUCKET }}/wi/${{ github.run_id }}/"
          aws s3 cp installers/linux-deb/ "${S3_PATH}" --recursive --exclude "*" --include "*.deb"
          aws s3 cp installers/linux-rpm/ "${S3_PATH}" --recursive --exclude "*" --include "*.rpm"
