name: Daily Build

# The nightly, and nothing else. Once a day it:
#
#   1. resets `nightly` to `main`
#   2. pins every dependency to its newest nightly build, or its newest release when the upstream
#      repo publishes none
#   3. stamps the timestamped product and extension versions and commits, so `git diff main nightly`
#      is exactly the pin and the build is reproducible from that commit
#   4. builds and replaces the rolling `nightly` release
#
# There are no inputs: the nightly always builds the full matrix. Dispatching this by hand runs
# exactly what the schedule runs, which is what you want when 06:30 fails.
#
# Ad-hoc builds of your own branch are dev-build.yml; real releases are release.yml. Neither this
# workflow nor those ever write to `main`.

on:
  schedule:
    # 12:00 PM IST = 06:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  # `nightly` only ever holds main plus a single version-pin commit, so last night's is discarded.
  # That commit is the record of what was built; the build itself consumes the `versions` artifact,
  # which carries the same two files.
  prepare-nightly:
    name: Sync nightly branch and pin versions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      integrator_version: ${{ steps.stamp.outputs.integrator_version }}
      wi_extension_version: ${{ steps.stamp.outputs.wi_extension_version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset nightly branch to main
        run: |
          git push --force origin "HEAD:refs/heads/nightly"
          echo "nightly now points at $(git rev-parse --short HEAD) (main)."

      - name: Pin dependency versions
        run: |
          chmod +x ./ci/build/resolve-nightly-versions.sh
          ./ci/build/resolve-nightly-versions.sh

      - name: Stamp product and extension versions
        id: stamp
        run: |
          chmod +x ./ci/build/apply-version.sh
          ./ci/build/apply-version.sh

      - name: Upload versions
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: |
            ci/build/component-versions.properties
            wi/wi-extension/package.json
          if-no-files-found: error

      - name: Commit pinned versions to nightly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B nightly
          git add ci/build/component-versions.properties wi/wi-extension/package.json
          git commit -m "Pin nightly versions for ${{ steps.stamp.outputs.integrator_version }}"
          git push --force origin nightly

  build:
    name: Build
    needs: prepare-nightly
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # The versions come from the commit just pushed to `nightly`; `nightly` is the rolling tag, so
      # build.yml deletes the previous release and its tag before publishing this one.
      versions_artifact: versions
      publish_tag: nightly
      is_prerelease: true
      runner: codebuild
      build_linux: true
      build_macos: true
      build_windows: true
      build_packed_installers: true
      ballerina_extension_source: github
      mi_extension_source: github
